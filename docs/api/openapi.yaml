          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricasAdminDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: El usuario no tiene rol `ADMIN`.
  /api/lugares/viables:
    get:
      tags: [Lugares]
      operationId: buscarLugaresViables
      summary: Lista los lugares del catálogo viables para un puente del estudiante.
      description: |
        Un lugar es viable si cumple las tres condiciones:

        1. Está en estado `ACTIVO` (verificado y aprobado por el administrador).
        2. Queda dentro del radio de la zona (campus) del estudiante, definida en HU5.
        3. El traslado de ida y vuelta (caminando, unos 80 m por minuto) más la actividad no supera la duración del puente.

        Los lugares salen ordenados del más cercano al más lejano. Si el estudiante todavía no eligió su campus se responde `200`
        con `estado` = `SIN_ZONA`; si ningún lugar cumple, `estado` = `SIN_RESULTADOS` y el mensaje
        «No encontramos opciones cercanas para este tiempo disponible.».
      security:
        - Bearer: []
      parameters:
        - name: puenteId
          in: query
          required: true
          description: Id de un puente del propio estudiante (`GET /api/puentes`).
          schema:
            type: integer
            format: int32
            minimum: 1
          example: 5
      responses:
        '200':
          description: Resultado de la búsqueda (`OK`, `SIN_RESULTADOS` o `SIN_ZONA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoBusquedaLugaresDto'
              examples:
                conLugares:
                  summary: Hay lugares viables
                  value:
                    estado: OK
                    mensaje: null
                    zona: { id: 1, nombre: Campus UCB La Paz }
                    radioAplicadoM: 800
                    minutosDisponibles: 120
                    lugares:
                      - lugarId: 2
                        nombre: Biblioteca Central
                        categoria: Estudio
                        descripcion: Salas silenciosas y computadoras para estudiar.
                        distanciaM: 55
                        tiempoTrasladoMin: 2
                        duracionEstimadaMin: 45
                sinResultados:
                  summary: Ningún lugar cumple tiempo, cercanía y verificación
                  value:
                    estado: SIN_RESULTADOS
                    mensaje: No encontramos opciones cercanas para este tiempo disponible.
                    zona: { id: 1, nombre: Campus UCB La Paz }
                    radioAplicadoM: 800
                    minutosDisponibles: 45
                    lugares: []
                sinZona:
                  summary: Falta elegir el campus
                  value:
                    estado: SIN_ZONA
                    mensaje: Elige tu campus para ver lugares cercanos.
                    zona: null
                    radioAplicadoM: null
                    minutosDisponibles: 120
                    lugares: []
        '400':
          description: Falta `puenteId` o no es un número positivo (`codigo` = `VALIDACION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: El puente no existe o no pertenece al usuario (`codigo` = `NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
  /api/recomendaciones:
    post:
      tags: [Recomendaciones]
      operationId: recomendar
      summary: Pide al asistente recomendaciones para un puente del usuario.
      description: |
        El asistente **solo** recibe los lugares del catálogo que cumplen tiempo, cercanía y zona (búsqueda de HU6),
        y el sistema descarta cualquier lugar o dato que no salga de ese contexto. Distancia, tiempo y categoría
        salen del catálogo; del asistente solo sale `explicacion`. Cada consulta queda en el log de auditoría con los
        lugares del catálogo que la respaldan.

        Si no hay lugares viables, no se llama al asistente y se responde `200` con `estado` = `SIN_RESULTADOS`
        y el mensaje «No encontramos opciones cercanas para este tiempo disponible.».
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRecomendacionDto'
            example:
              puenteId: 5
              entrada: Estoy cansado, quiero algo tranquilo
      responses:
        '200':
          description: Recomendaciones (`OK`) o mensaje de que no hay opciones (`SIN_RESULTADOS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaRecomendacionDto'
              examples:
                conRecomendaciones:
                  summary: Hay lugares viables
                  value:
                    consultaId: 42
                    estado: OK
                    mensaje: null
                    recomendaciones:
                      - id: 87
                        lugarId: 2
                        nombre: Biblioteca Central
                        categoria: Estudio
                        distanciaM: 200
                        tiempoTrasladoMin: 6
                        duracionEstimadaMin: 30
                        explicacion: Ideal para repasar en silencio antes de tu próxima clase.
                sinResultados:
                  summary: Ningún lugar cumple tiempo, cercanía y seguridad
                  value:
                    consultaId: 43
                    estado: SIN_RESULTADOS
                    mensaje: No encontramos opciones cercanas para este tiempo disponible.
                    recomendaciones: []
        '400':
          description: La preferencia supera los 300 caracteres (`codigo` = `VALIDACION`) o el cuerpo está mal formado (`ProblemDetails` estándar de ASP.NET).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
              example:
                codigo: VALIDACION
                mensaje: La preferencia puede tener como máximo 300 caracteres.
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: El puente no existe o no pertenece al usuario (`codigo` = `NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
              example:
                codigo: NO_ENCONTRADO
                mensaje: El puente no existe.
        '503':
          description: El asistente no respondió (`codigo` = `ASISTENTE_NO_DISPONIBLE`). La consulta queda registrada como `ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
              example:
                codigo: ASISTENTE_NO_DISPONIBLE
                mensaje: El asistente no está disponible en este momento. Intenta de nuevo en unos minutos.
  /api/recomendaciones/{id}/feedback:
    patch:
      tags: [Recomendaciones]
      operationId: valorarRecomendacion
      summary: Valora una recomendación con me gusta (LIKE) o no me sirve (DISLIKE) (HU9).
      description: |
        El voto queda asociado a la recomendación y, por su consulta, al usuario del token: solo se valoran las
        recomendaciones propias. Hay una sola valoración por recomendación: votar de nuevo reemplaza la anterior
        (no se duplica) y repetir el mismo voto no cambia nada. Las valoraciones aparecen en `GET /api/admin/metricas`.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id de la recomendación (viene en cada recomendación de `POST /api/recomendaciones`).
          schema: { type: integer, format: int64, example: 87 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRecomendacionDto'
      responses:
        '200':
          description: Valoración guardada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackGuardadoDto'
        '400':
          description: El voto no es `LIKE` ni `DISLIKE` (`VALIDACION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: La recomendación no existe o no es tuya (`NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
  /api/perfil:
    get:
      tags: [Perfil]
      operationId: obtenerPerfil
      summary: Devuelve el perfil del usuario autenticado.
      security:
        - Bearer: []
      responses:
        '200':
          description: Nombre, correo institucional, rol, carrera y semestre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: La cuenta no existe o está dada de baja (`codigo` = `NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
    put:
      tags: [Perfil]
      operationId: actualizarPerfil
      summary: Actualiza nombre, carrera y semestre.
      description: |
        Nombre obligatorio (hasta 100 caracteres); carrera (hasta 80) y semestre (1 a 10) opcionales.
        Si se envía `correo` o `rol` distintos a los actuales, se rechaza con `NO_EDITABLE`.
        El cambio queda en `historial_cambio` con los valores de antes y de después.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPerfilRequest'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilDto'
        '400':
          description: Datos inválidos (`VALIDACION`) o intento de cambiar correo o rol (`NO_EDITABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
  /api/matching:
    get:
      tags: [Matching]
      operationId: buscarCompaneros
      summary: Compañeros con tiempo libre compatible con uno de tus puentes.
      description: |
        Cruce por franja horaria: mismo día y 30 minutos o más en común. Orden por compatibilidad: más minutos en común
        primero; en empate, más franjas compartidas en la semana. Solo cruza estudiantes de tu sede activa que aceptaron
        aparecer, y exige que tú también lo hayas aceptado. Siempre 200 si el puente es tuyo: mira `estado`
        (`OK`, `SIN_RESULTADOS`, `SIN_ZONA` o `NO_VISIBLE`). No devuelve correos ni ids.
      security:
        - Bearer: []
      parameters:
        - name: puenteId
          in: query
          required: true
          description: Id de uno de tus puentes (de `GET /api/puentes`).
          schema: { type: integer, format: int32, minimum: 1, example: 5 }
      responses:
        '200':
          description: Resultado del matching.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoMatchingDto'
        '400':
          description: Falta `puenteId` (`VALIDACION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: El puente no existe o no es tuyo (`NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
  /api/matching/configuracion:
    get:
      tags: [Matching]
      operationId: obtenerConfiguracionMatching
      summary: Si aceptaste que compañeros con tiempo compatible te encuentren.
      security:
        - Bearer: []
      responses:
        '200':
          description: Consentimiento actual. Por defecto, `visible` es `false`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionMatchingDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
    put:
      tags: [Matching]
      operationId: actualizarConfiguracionMatching
      summary: Acepta o retira el consentimiento para aparecer en el matching.
      description: Al aceptar se guarda la fecha; al retirarlo dejas de aparecer y tampoco ves a otros. El cambio queda en `historial_cambio`.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarConfiguracionMatchingRequest'
      responses:
        '200':
          description: Consentimiento actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionMatchingDto'
        '400':
          description: Falta `visible` (`VALIDACION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Comprueba que la API está en marcha.
      responses:
        '200':
          description: La API responde.
  /health/db:
    get:
      tags: [Health]
      operationId: healthDb
      summary: Comprueba que la API puede conectarse a la base de datos MySQL.
      responses:
        '200':
          description: Conexión a la base de datos correcta.
        '503':
          description: No se pudo conectar a la base de datos.
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido en `POST /api/auth/login` o `POST /api/auth/register`. Pégalo sin la palabra `Bearer`.
  responses:
    NoAutorizado:
      description: Falta el token, es inválido o está vencido. Sin cuerpo.
    BloqueNoEncontrado:
      description: El bloque no existe o no pertenece al usuario (`codigo` = `NO_ENCONTRADO`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorNegocioDto'
          example:
            codigo: NO_ENCONTRADO
            mensaje: El bloque no existe.
    Duplicado:
      description: Ya existe la misma materia ese día a esa hora de inicio (`codigo` = `DUPLICADO`). Un choque con otra materia no es error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorNegocioDto'
          example:
            codigo: DUPLICADO
            mensaje: Ya registraste «Cálculo I» a esa hora ese día.
    DatosInvalidos:
      description: |
        Datos inválidos. Hay dos formas de respuesta:
        - Regla de negocio incumplida: `{ "codigo": "VALIDACION", "mensaje": "..." }` (`ErrorNegocioDto`).
        - Cuerpo mal formado o con campos faltantes: `ValidationProblemDetails` estándar de ASP.NET.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorNegocioDto'
              - $ref: '#/components/schemas/ValidationProblemDetails'
          examples:
            horaFinInvalida:
              summary: La hora de fin no es posterior a la de inicio
              value:
                codigo: VALIDACION
                mensaje: La hora de fin tiene que ser posterior a la hora de inicio.
            formatoDeHora:
              summary: Hora con formato no admitido
              value:
                codigo: VALIDACION
                mensaje: Las horas deben tener formato HH:mm o HH:mm:ss.
            diaFueraDeRango:
              summary: Día fuera de 1 a 6
              value:
                codigo: VALIDACION
                mensaje: El día debe ir de 1 (lunes) a 6 (sábado).
            materiaVacia:
              summary: Materia vacía
              value:
                codigo: VALIDACION
                mensaje: La materia es obligatoria.
  schemas:
    LoginRequestDto:
      type: object
      description: Credenciales para iniciar sesión.
      required: [email, password]
      properties:
        email:
          type: string
          description: Correo institucional. Solo se aceptan direcciones `usuario@ucb.edu.bo`.
          example: dev.estudiante@ucb.edu.bo
        password:
          type: string
          format: password
          description: Contraseña de la cuenta.
          example: Breaku-Dev-2026!
    RegisterRequestDto:
      type: object
      description: Datos para crear una cuenta de estudiante.
      required: [nombre, email, password]
      properties:
        nombre:
          type: string
          description: Nombre completo del estudiante.
          example: Ana Pérez
        email:
          type: string
          description: Correo institucional. Solo se aceptan direcciones `usuario@ucb.edu.bo` y no puede estar ya registrado.
          example: ana.perez@ucb.edu.bo
        password:
          type: string
          format: password
          description: Contraseña de la cuenta. Se guarda con hash BCrypt.
          example: MiClaveSegura-2026
    AuthResponseDto:
      type: object
      description: Sesión iniciada. Token JWT y datos básicos del usuario.
      properties:
        token:
          type: string
          description: 'Token JWT (HS256, vigencia de 24 horas). Claims `sub` (id del usuario), `email`, `nombre` y `role` (`ESTUDIANTE` o `ADMIN`). Se envía en `Authorization: Bearer {token}`.'
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI3In0.firma
        userId:
          type: integer
          format: int32
          description: Identificador del usuario.
          example: 7
        nombre:
          type: string
          description: Nombre completo del usuario.
          example: Ana Pérez
        email:
          type: string
          description: Correo institucional del usuario.
          example: ana.perez@ucb.edu.bo
        rol:
          type: string
          enum: [ESTUDIANTE, ADMIN]
          description: Rol del usuario. El frontend lo usa para mostrar el panel de administración.
          example: ESTUDIANTE
    ErrorMensajeDto:
      type: object
      description: Error de autenticación (login y registro).
      properties:
        message:
          type: string
          description: Mensaje en español, listo para mostrar al usuario.
          example: Solo se permite el acceso con un correo institucional (@ucb.edu.bo)
    ErrorNegocioDto:
      type: object
      description: Error de negocio (horarios, notificaciones y recomendaciones).
      properties:
        codigo:
          type: string
          enum: [VALIDACION, DUPLICADO, NO_ENCONTRADO, ASISTENTE_NO_DISPONIBLE]
          description: '`VALIDACION` (400), `DUPLICADO` (409), `NO_ENCONTRADO` (404) o `ASISTENTE_NO_DISPONIBLE` (503).'
          example: DUPLICADO
        mensaje:
          type: string
          description: Mensaje en español, listo para mostrar al usuario.
          example: Ya registraste «Cálculo I» a esa hora ese día.
    ValidationProblemDetails:
      type: object
      description: Error de validación estándar de ASP.NET (cuerpo mal formado o campos faltantes).
      properties:
        type:
          type: string
          nullable: true
          example: https://tools.ietf.org/html/rfc9110#section-15.5.1
        title:
          type: string
          nullable: true
          example: One or more validation errors occurred.
        status:
          type: integer
          format: int32
          nullable: true
          example: 400
        errors:
          type: object
          description: Campo → lista de mensajes.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            req: [El campo req es obligatorio.]
    GuardarHorarioRequest:
      type: object
      description: Datos de un bloque de clase. Sirve para crear (POST) y para reemplazar (PUT) un bloque.
      required: [materia, diaSemana, horaInicio, horaFin]
      properties:
        materia:
          type: string
          minLength: 1
          maxLength: 100
          description: Nombre de la materia. Obligatorio, hasta 100 caracteres (se recortan los espacios de los extremos).
          example: Cálculo I
        diaSemana:
          type: integer
          format: int32
          minimum: 1
          maximum: 6
          description: 'Día de la semana: 1 = lunes … 6 = sábado.'
          example: 1
        horaInicio:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$'
          description: Hora de inicio en formato 24 h (`HH:mm` o `HH:mm:ss`).
          example: '08:00'
        horaFin:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$'
          description: Hora de fin en formato 24 h (`HH:mm` o `HH:mm:ss`). Debe ser posterior a la hora de inicio.
          example: '09:30'
        aula:
          type: string
          nullable: true
          maxLength: 30
          description: Aula (opcional, hasta 30 caracteres). Si llega vacía se guarda como `null`.
          example: A-101
        asiste:
          type: boolean
          nullable: true
          description: Si el estudiante asiste a este bloque. Si no se envía, es `true` al crear y se conserva el valor actual al editar.
          example: true
        autorizacionCarrera:
          type: boolean
          nullable: true
          description: El estudiante confirma que su carrera autoriza que este bloque coincida con otro. Opcional; si no se envía se conserva el valor actual.
          example: false
    HorarioDto:
      type: object
      description: Bloque de clase del estudiante.
      properties:
        id:
          type: integer
          format: int32
          description: Identificador del bloque.
          example: 12
        materia:
          type: string
          description: Nombre de la materia.
          example: Cálculo I
        diaSemana:
          type: integer
          format: int32
          description: 'Día de la semana: 1 = lunes … 6 = sábado.'
          example: 1
        horaInicio:
          type: string
          description: Hora de inicio (`HH:mm:ss`, 24 h).
          example: '08:00:00'
        horaFin:
          type: string
          description: Hora de fin (`HH:mm:ss`, 24 h).
          example: '09:30:00'
        aula:
          type: string
          nullable: true
          description: Aula, o `null` si no se indicó.
          example: A-101
        origen:
          type: string
          enum: [MANUAL, FOTO]
          description: 'Cómo se cargó el bloque: `MANUAL` o `FOTO`. El cliente no lo envía.'
          example: MANUAL
        asiste:
          type: boolean
          description: Si el estudiante asiste a este bloque. Si es `false` no cuenta como tiempo ocupado y no choca con otros.
          example: true
        autorizacionCarrera:
          type: boolean
          description: El estudiante confirmó que su carrera autoriza el choque.
          example: false
        coincide:
          type: array
          description: Bloques del mismo día que se cruzan con éste, asista o no el estudiante (sirve para preguntarle a cuál asiste).
          items:
            $ref: '#/components/schemas/CoincidenciaDto'
        advertencias:
          type: array
          description: Un aviso por cada bloque con el que choca de verdad (el estudiante asiste a los dos). No impiden guardar.
          items:
            type: string
          example: ['Coincide con «MAT-241» (14:15-15:45).']
    CoincidenciaDto:
      type: object
      description: Otro bloque del mismo día que se cruza con el consultado.
      properties:
        id: { type: integer, format: int32, example: 13 }
        materia: { type: string, example: MAT-241 }
        horaInicio: { type: string, example: '14:15:00' }
        horaFin: { type: string, example: '15:45:00' }
        asiste: { type: boolean, example: true }
    CambiarAsistenciaRequest:
      type: object
      required: [asiste]
      properties:
        asiste: { type: boolean, example: false }
        autorizacionCarrera: { type: boolean, nullable: true, description: Opcional; si no se envía se conserva el valor actual., example: true }
    CambiarAsistenciasRequest:
      type: object
      required: [bloques]
      properties:
        bloques:
          type: array
          maxItems: 40
          items:
            type: object
            required: [id, asiste]
            properties:
              id: { type: integer, format: int32, example: 12 }
              asiste: { type: boolean, example: false }
              autorizacionCarrera: { type: boolean, nullable: true, example: true }
    PuenteDto:
      type: object
      description: Puente detectado. Hueco libre de 45 minutos o más entre dos clases del mismo día.
      properties:
        id:
          type: integer
          format: int32
          description: Identificador del puente.
          example: 5
        diaSemana:
          type: integer
          format: int32
          description: 'Día de la semana: 1 = lunes … 6 = sábado.'
          example: 1
        horaInicio:
          type: string
          description: Hora en que termina la clase anterior (`HH:mm:ss`, 24 h).
          example: '09:30:00'
        horaFin:
          type: string
          description: Hora en que empieza la clase siguiente (`HH:mm:ss`, 24 h).
          example: '10:30:00'
    NotificacionDto:
      type: object
      description: Aviso para el estudiante. Hoy solo existe el tipo `PUENTE_DISPONIBLE` (HU4).
      properties:
        id:
          type: integer
          format: int64
          description: Identificador de la notificación.
          example: 31
        tipo:
          type: string
          enum: [PUENTE_DISPONIBLE, INVITACION_COMUNIDAD, COMUNIDAD_CERRADA]
          description: Tipo de aviso.
          example: PUENTE_DISPONIBLE
        mensaje:
          type: string
          description: Texto listo para mostrar al usuario.
          example: ¡Puente disponible! Tienes 1 h 30 min libres, de 10:00 a 11:30.
        fecha:
          type: string
          format: date
          nullable: true
          description: Día del puente (`yyyy-MM-dd`, hora de Bolivia). `null` si no es un aviso de puente.
          example: '2026-10-22'
        horaInicio:
          type: string
          nullable: true
          description: Inicio del puente (`HH:mm:ss`). `null` si no es un aviso de puente.
          example: '10:00:00'
        horaFin:
          type: string
          nullable: true
          description: Fin del puente (`HH:mm:ss`). `null` si no es un aviso de puente.
          example: '11:30:00'
        duracionMinutos:
          type: integer
          format: int32
          nullable: true
          description: Duración disponible del puente en minutos. `null` si no es un aviso de puente.
          example: 90
        leida:
          type: boolean
          description: Si el usuario ya la marcó como leída.
          example: false
        creadaEn:
          type: string
          format: date-time
          description: Momento del envío (UTC).
          example: '2026-10-22T14:00:04.512Z'
    ConfiguracionNotificacionesDto:
      type: object
      description: Preferencia de avisos del usuario.
      required: [notificacionesActivas]
      properties:
        notificacionesActivas:
          type: boolean
          description: '`true` = recibe avisos de puente. `false` = no recibe ninguno, aunque sus puentes se siguen detectando.'
          example: true
    SolicitudRecomendacionDto:
      type: object
      description: Pedido de recomendación para un puente del usuario.
      required: [puenteId]
      properties:
        puenteId:
          type: integer
          format: int32
          description: Puente del usuario para el que se busca qué hacer (ver `GET /api/puentes`).
          example: 5
        entrada:
          type: string
          nullable: true
          maxLength: 300
          description: Preferencia libre del estudiante (opcional).
          example: Estoy cansado, quiero algo tranquilo
    RespuestaRecomendacionDto:
      type: object
      description: Resultado de la consulta al asistente.
      properties:
        consultaId:
          type: integer
          format: int64
          description: Identificador del registro de auditoría de esta consulta.
          example: 42
        estado:
          type: string
          enum: [OK, SIN_RESULTADOS]
          description: '`OK` = hay recomendaciones. `SIN_RESULTADOS` = no hay; se muestra `mensaje`.'
          example: OK
        mensaje:
          type: string
          nullable: true
          description: Texto para mostrar cuando no hay recomendaciones. `null` si las hay.
          example: No encontramos opciones cercanas para este tiempo disponible.
        recomendaciones:
          type: array
          description: De la más a la menos adecuada (máximo 3). Vacía si `estado` = `SIN_RESULTADOS`.
          items:
            $ref: '#/components/schemas/RecomendacionDto'
    RecomendacionDto:
      type: object
      description: Una recomendación. Todos los datos salen del catálogo; del asistente solo sale `explicacion`.
      properties:
        id:
          type: integer
          format: int64
          description: Identificador de la recomendación.
          example: 87
        lugarId:
          type: integer
          format: int32
          description: Lugar del catálogo que respalda la recomendación.
          example: 2
        nombre:
          type: string
          description: Nombre del lugar, tal como está en el catálogo.
          example: Biblioteca Central
        categoria:
          type: string
          description: Categoría del lugar.
          example: Estudio
        distanciaM:
          type: integer
          format: int32
          description: Distancia desde la zona del estudiante, en metros.
          example: 200
        tiempoTrasladoMin:
          type: integer
          format: int32
          description: Tiempo de traslado de ida y vuelta, en minutos.
          example: 6
        duracionEstimadaMin:
          type: integer
          format: int32
          description: Tiempo estimado de la actividad en el lugar, en minutos.
          example: 30
        explicacion:
          type: string
          description: Por qué encaja, redactado por el asistente.
          example: Ideal para repasar en silencio antes de tu próxima clase.
        feedback:
          type: string
          nullable: true
          enum: [LIKE, DISLIKE]
          description: Valoración del estudiante (HU9), o `null` si todavía no valoró.
          example: null
    FeedbackRecomendacionDto:
      type: object
      required: [feedback]
      properties:
        feedback: { type: string, enum: [LIKE, DISLIKE], description: No distingue mayúsculas., example: LIKE }
    FeedbackGuardadoDto:
      type: object
      properties:
        recomendacionId: { type: integer, format: int64, example: 87 }
        feedback: { type: string, enum: [LIKE, DISLIKE], example: LIKE }
        fechaFeedback: { type: string, format: date-time, example: '2026-10-31T14:00:04.512Z' }
    ZonaDto:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        nombre:
          type: string
          example: Campus central
    EstadoUbicacionDto:
      type: object
      required: [consentimientoActivo, zonaActual]
      properties:
        consentimientoActivo:
          type: boolean
          description: Indica si el estudiante autorizó compartir ubicación del dispositivo.
          example: false
        zonaActual:
          allOf:
            - $ref: '#/components/schemas/ZonaDto'
          nullable: true
          description: Campus elegido o detectado, o `null` si no se ha seleccionado.
    CompartirUbicacionRequest:
      type: object
      required: [latitud, longitud]
      properties:
        latitud:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: -16.5
        longitud:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -68.15
    SeleccionarZonaRequest:
      type: object
      required: [zonaId]
      properties:
        zonaId:
          type: integer
          format: int32
          minimum: 1
          example: 1
    LugarViableDto:
      type: object
      required: [lugarId, nombre, categoria, distanciaM, tiempoTrasladoMin, duracionEstimadaMin]
      properties:
        lugarId:
          type: integer
          format: int32
          example: 2
        nombre:
          type: string
          example: Biblioteca Central
        categoria:
          type: string
          example: Estudio
        descripcion:
          type: string
          nullable: true
          example: Salas silenciosas y computadoras para estudiar.
        distanciaM:
          type: integer
          format: int32
          description: Distancia en línea recta desde el campus, en metros.
          example: 120
        tiempoTrasladoMin:
          type: integer
          format: int32
          description: Minutos de traslado caminando, de ida y vuelta.
          example: 3
        duracionEstimadaMin:
          type: integer
          format: int32
          description: Minutos que lleva la actividad en el lugar.
          example: 45
        validado:
          type: boolean
          description: '`false` si el equipo todavía no revisó los datos del lugar; la app lo muestra como «Por validar».'
          example: false
        tipoLugar:
          type: string
          nullable: true
          description: Tipo de lugar según el relevamiento.
          example: campus
        modalidad:
          type: array
          items: { type: string }
          example: [solitario, grupal]
        nivelEnergia:
          type: array
          items: { type: string }
          example: [bajo]
        actividadesSugeridas:
          type: array
          items: { type: string }
          example: [estudiar, leer]
    ResultadoBusquedaLugaresDto:
      type: object
      required: [estado, minutosDisponibles, lugares]
      properties:
        estado:
          type: string
          enum: [OK, SIN_RESULTADOS, SIN_ZONA]
          example: OK
        mensaje:
          type: string
          nullable: true
          description: Texto para mostrar cuando el estado no es `OK`.
        zona:
          allOf:
            - $ref: '#/components/schemas/ZonaDto'
          nullable: true
          description: Campus usado como origen; `null` con `SIN_ZONA`.
        radioAplicadoM:
          type: integer
          format: int32
          nullable: true
          example: 800
        minutosDisponibles:
          type: integer
          format: int32
          description: Duración del puente consultado, en minutos.
          example: 110
        lugares:
          type: array
          items:
    ResumenAdminDto:
      type: object
      properties:
        lugaresActivos: { type: integer, format: int32, example: 6 }
        lugaresEnRevision: { type: integer, format: int32, example: 1 }
        estudiantes: { type: integer, format: int32, example: 3 }
        comunidadesHoy: { type: integer, format: int32, example: 0 }
        consultasRagSemana: { type: integer, format: int32, example: 18 }
        reportesPendientes: { type: integer, format: int32, example: 0 }
    LugarAdminDto:
      type: object
      properties:
        id: { type: integer, format: int32, example: 6 }
        nombre: { type: string, example: Biblioteca Central }
        categoria: { type: string, example: Estudio }
        estado: { type: string, enum: [ACTIVO, EN_REVISION, INACTIVO], example: ACTIVO }
        duracionEstimadaMin: { type: integer, format: int32, example: 45 }
        horaApertura: { type: string, nullable: true, description: 'HH:mm', example: '07:00' }
        horaCierre: { type: string, nullable: true, description: 'HH:mm', example: '21:00' }
        vecesRecomendado: { type: integer, format: int32, example: 15 }
        validado: { type: boolean, description: 'false: datos del relevamiento que el equipo todavía no revisó.', example: false }
        recomendable: { type: boolean, description: 'false: punto de referencia (campus, parqueo, bloques), nunca se recomienda.', example: true }
        tipoLugar: { type: string, nullable: true, example: comida }
    CambioEstadoLugarDto:
      type: object
      required: [estado]
      properties:
        estado: { type: string, enum: [ACTIVO, EN_REVISION, INACTIVO], example: INACTIVO }
    ReporteAdminDto:
      type: object
      properties:
        id: { type: integer, format: int32 }
        motivo: { type: string, example: INFORMACION_INCORRECTA }
        descripcion: { type: string, nullable: true }
        estado: { type: string, enum: [PENDIENTE, RESUELTO, DESCARTADO] }
        objeto: { type: string, description: Nombre del lugar o actividad de la comunidad reportada., example: Cafetería Central }
        autor: { type: string, example: Ana Pérez }
        creadoEn: { type: string, format: date-time }
    ConsultaRagAdminDto:
      type: object
      properties:
        id: { type: integer, format: int64, example: 18 }
        fecha: { type: string, format: date-time }
        usuario: { type: string, example: Ana Pérez }
        tipo: { type: string, example: RECOMENDACION }
        entrada: { type: string, nullable: true, example: Una plática con café }
        estado: { type: string, enum: [OK, SIN_RESULTADOS, RECHAZADO_SEGURIDAD, ERROR] }
        modelo: { type: string, nullable: true, example: 'qwen2.5:3b' }
        latenciaMs: { type: integer, format: int32, nullable: true, example: 23494 }
        lugaresRecuperados: { type: integer, format: int32, example: 5 }
        recomendados: { type: integer, format: int32, example: 3 }
    MetricasAdminDto:
      type: object
      properties:
        consultasTotales: { type: integer, format: int32, example: 18 }
        ok: { type: integer, format: int32, example: 16 }
        sinResultados: { type: integer, format: int32, example: 0 }
        rechazadas: { type: integer, format: int32, example: 0 }
        errores: { type: integer, format: int32, example: 2 }
        latenciaPromedioMs: { type: integer, format: int32, nullable: true, example: 23494 }
        masRecomendados:
          type: array
          items:
            type: object
            properties:
              nombre: { type: string, example: Biblioteca Central }
              categoria: { type: string, example: Estudio }
              veces: { type: integer, format: int32, example: 15 }
              meGusta: { type: integer, format: int32, example: 6, description: Valoraciones LIKE del lugar (HU9). }
              noMeSirve: { type: integer, format: int32, example: 1, description: Valoraciones DISLIKE del lugar (HU9). }
        meGusta: { type: integer, format: int32, example: 9, description: Valoraciones LIKE registradas en los últimos 7 días (HU9). }
        noMeSirve: { type: integer, format: int32, example: 2, description: Valoraciones DISLIKE registradas en los últimos 7 días (HU9). }
    ClaseLeidaDto:
      type: object
      properties:
        materia: { type: string, example: Cálculo II }
        diaSemana: { type: integer, format: int32, minimum: 1, maximum: 6, example: 2 }
        horaInicio: { type: string, description: 'HH:mm', example: '07:30' }
        horaFin: { type: string, description: 'HH:mm', example: '09:00' }
        aula: { type: string, nullable: true, example: A-101 }
    LecturaFotoHorarioDto:
      type: object
      properties:
        clases:
          type: array
          items:
            $ref: '#/components/schemas/ClaseLeidaDto'
        descartadas: { type: integer, format: int32, example: 1 }
    ResultadoLoteDto:
      type: object
      properties:
        guardados:
          type: array
          items:
            $ref: '#/components/schemas/HorarioDto'
        rechazados:
          type: array
          items:
            type: object
            properties:
              indice: { type: integer, format: int32, example: 1 }
              materia: { type: string, example: Física II }
              motivo: { type: string, example: 'Ya registraste «Cálculo II» a esa hora ese día.' }
    PerfilDto:
      type: object
      properties:
        nombre: { type: string, example: Ana Pérez }
        correo: { type: string, example: ana.perez@ucb.edu.bo }
        rol: { type: string, enum: [ESTUDIANTE, ADMIN] }
        carrera: { type: string, nullable: true, example: Ingeniería de Sistemas }
        semestre: { type: integer, format: int32, nullable: true, minimum: 1, maximum: 10, example: 5 }
    ActualizarPerfilRequest:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string, maxLength: 100, example: Ana Pérez }
        carrera: { type: string, nullable: true, maxLength: 80, example: Ingeniería de Sistemas }
        semestre: { type: integer, format: int32, nullable: true, minimum: 1, maximum: 10, example: 5 }
        correo: { type: string, nullable: true, description: No editable; si llega distinto al actual responde NO_EDITABLE. }
        rol: { type: string, nullable: true, description: No editable; si llega distinto al actual responde NO_EDITABLE. }
    ConfiguracionMatchingDto:
      type: object
      properties:
        visible: { type: boolean, example: true }
        desde: { type: string, format: date-time, nullable: true, example: '2026-10-31T14:00:04.512Z' }
    ActualizarConfiguracionMatchingRequest:
      type: object
      required: [visible]
      properties:
        visible: { type: boolean, example: true }
    CompaneroCompatibleDto:
      type: object
      properties:
        nombre: { type: string, example: Ana Quiroga }
        carrera: { type: string, nullable: true, example: Ingeniería de Sistemas }
        semestre: { type: integer, format: int32, nullable: true, example: 5 }
        horaInicio: { type: string, example: '09:30:00', description: Inicio del tramo en común. }
        horaFin: { type: string, example: '11:00:00', description: Fin del tramo en común. }
        minutosEnComun: { type: integer, format: int32, minimum: 30, example: 90 }
        porcentaje: { type: integer, format: int32, minimum: 1, maximum: 100, example: 100 }
        franjasCompartidas: { type: integer, format: int32, minimum: 1, example: 1 }
    ResultadoMatchingDto:
      type: object
      properties:
        estado: { type: string, enum: [OK, SIN_RESULTADOS, SIN_ZONA, NO_VISIBLE] }
        mensaje: { type: string, nullable: true, example: Por ahora nadie de tu campus está libre contigo en este puente. }
        puente:
          $ref: '#/components/schemas/PuenteDto'
        minutosPuente: { type: integer, format: int32, example: 90 }
        companeros:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CompaneroCompatibleDto'
