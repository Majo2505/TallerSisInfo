  /api/lugares/{id}/foto:
    get:
      tags: [Lugares]
      operationId: fotoLugar
      summary: Foto real de un lugar del catálogo.
      description: Pública, porque la pide la etiqueta `img`, que no manda el token; la foto de un lugar del campus no es un dato privado. Usar la ruta de `fotoUrl` (con `?v=`); con la versión se guarda un año en el navegador (`immutable`) y se vuelve a pedir solo cuando el administrador la cambia.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int32, example: 21 }
        - name: v
          in: query
          required: false
          description: Versión de la foto (la pone el servidor en `fotoUrl`).
          schema: { type: string }
      responses:
        '200':
          description: La imagen.
          content:
            image/jpeg: { schema: { type: string, format: binary } }
            image/png: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        '404':
          description: El lugar no tiene foto o no existe (`codigo` = `NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
  /api/lugares/viables:
    get:
      tags: [Lugares]
      operationId: buscarLugaresViables
      summary: Lista los lugares del catálogo viables para un puente del estudiante.
      description: |
        Un lugar es viable si cumple las tres condiciones:

        1. Está en estado `ACTIVO` (verificado y aprobado por el administrador).
        2. Queda dentro del radio de la zona (campus) del estudiante, definida en HU5.
        3. El traslado de ida y vuelta (caminando, unos 80 m por minuto) más la actividad no supera la duración del puente.

        Los lugares salen ordenados del más cercano al más lejano. Si el estudiante todavía no eligió su campus se responde `200`
        con `estado` = `SIN_ZONA`; si ningún lugar cumple, `estado` = `SIN_RESULTADOS` y el mensaje
        «No encontramos opciones cercanas para este tiempo disponible.».
      security:
        - Bearer: []
      parameters:
        - name: puenteId
          in: query
          required: true
          description: Id de un puente del propio estudiante (`GET /api/puentes`).
          schema:
            type: integer
            format: int32
            minimum: 1
          example: 5
      responses:
        '200':
          description: Resultado de la búsqueda (`OK`, `SIN_RESULTADOS` o `SIN_ZONA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoBusquedaLugaresDto'
              examples:
                conLugares:
                  summary: Hay lugares viables
                  value:
                    estado: OK
                    mensaje: null
                    zona: { id: 1, nombre: Campus UCB La Paz }
                    radioAplicadoM: 800
                    minutosDisponibles: 120
                    lugares:
                      - lugarId: 2
                        nombre: Biblioteca Central
                        categoria: Estudio
                        descripcion: Salas silenciosas y computadoras para estudiar.
                        distanciaM: 55
                        tiempoTrasladoMin: 2
                        duracionEstimadaMin: 45
                sinResultados:
                  summary: Ningún lugar cumple tiempo, cercanía y verificación
                  value:
                    estado: SIN_RESULTADOS
                    mensaje: No encontramos opciones cercanas para este tiempo disponible.
                    zona: { id: 1, nombre: Campus UCB La Paz }
                    radioAplicadoM: 800
                    minutosDisponibles: 45
                    lugares: []
                sinZona:
                  summary: Falta elegir el campus
                  value:
                    estado: SIN_ZONA
                    mensaje: Elige tu campus para ver lugares cercanos.
                    zona: null
                    radioAplicadoM: null
                    minutosDisponibles: 120
                    lugares: []
        '400':
          description: Falta `puenteId` o no es un número positivo (`codigo` = `VALIDACION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: El puente no existe o no pertenece al usuario (`codigo` = `NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
  /api/recomendaciones:
    post:
      tags: [Recomendaciones]
      operationId: recomendar
      summary: Pide al asistente recomendaciones para un puente del usuario.
      description: |
        El asistente **solo** recibe los lugares del catálogo que cumplen tiempo, cercanía y zona (búsqueda de HU6),
        y el sistema descarta cualquier lugar o dato que no salga de ese contexto. Distancia, tiempo y categoría
        salen del catálogo; del asistente solo sale `explicacion`. Cada consulta queda en el log de auditoría con los
        lugares del catálogo que la respaldan.

        Si no hay lugares viables, no se llama al asistente y se responde `200` con `estado` = `SIN_RESULTADOS`
        y el mensaje «No encontramos opciones cercanas para este tiempo disponible.».
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRecomendacionDto'
            example:
              puenteId: 5
              entrada: Estoy cansado, quiero algo tranquilo
      responses:
        '200':
          description: Recomendaciones (`OK`) o mensaje de que no hay opciones (`SIN_RESULTADOS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaRecomendacionDto'
              examples:
                conRecomendaciones:
                  summary: Hay lugares viables
                  value:
                    consultaId: 42
                    estado: OK
                    mensaje: null
                    recomendaciones:
                      - id: 87
                        lugarId: 2
                        nombre: Biblioteca Central
                        categoria: Estudio
                        distanciaM: 200
                        tiempoTrasladoMin: 6
                        duracionEstimadaMin: 30
                        explicacion: Ideal para repasar en silencio antes de tu próxima clase.
                sinResultados:
                  summary: Ningún lugar cumple tiempo, cercanía y seguridad
                  value:
                    consultaId: 43
                    estado: SIN_RESULTADOS
                    mensaje: No encontramos opciones cercanas para este tiempo disponible.
                    recomendaciones: []
        '400':
          description: La preferencia supera los 300 caracteres (`codigo` = `VALIDACION`), no se puede enviar al asistente porque intenta cambiar sus instrucciones, pide datos internos o está fuera del reglamento (`codigo` = `SOLICITUD_NO_PERMITIDA`, queda en la auditoría como `RECHAZADO_SEGURIDAD`), o el cuerpo está mal formado (`ProblemDetails` estándar de ASP.NET).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
              examples:
                demasiadoLarga:
                  summary: La preferencia es demasiado larga
                  value:
                    codigo: VALIDACION
                    mensaje: La preferencia puede tener como máximo 300 caracteres.
                solicitudNoPermitida:
                  summary: La preferencia no se puede enviar al asistente (HU17)
                  value:
                    codigo: SOLICITUD_NO_PERMITIDA
                    mensaje: Solo puedo recomendar actividades académicas y respetuosas, dentro del reglamento de la universidad.
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: El puente no existe o no pertenece al usuario (`codigo` = `NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
              example:
                codigo: NO_ENCONTRADO
                mensaje: El puente no existe.
        '503':
          description: El asistente no respondió (`codigo` = `ASISTENTE_NO_DISPONIBLE`). La consulta queda registrada como `ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
              example:
                codigo: ASISTENTE_NO_DISPONIBLE
                mensaje: El asistente no está disponible en este momento. Intenta de nuevo en unos minutos.
  /api/recomendaciones/{id}/feedback:
    patch:
      tags: [Recomendaciones]
      operationId: valorarRecomendacion
      summary: Valora una recomendación con me gusta (LIKE) o no me sirve (DISLIKE) (HU9).
      description: |
        El voto queda asociado a la recomendación y, por su consulta, al usuario del token: solo se valoran las
        recomendaciones propias. Hay una sola valoración por recomendación: votar de nuevo reemplaza la anterior
        (no se duplica) y repetir el mismo voto no cambia nada. Las valoraciones aparecen en `GET /api/admin/metricas`.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id de la recomendación (viene en cada recomendación de `POST /api/recomendaciones`).
          schema: { type: integer, format: int64, example: 87 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackRecomendacionDto'
      responses:
        '200':
          description: Valoración guardada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackGuardadoDto'
        '400':
          description: El voto no es `LIKE` ni `DISLIKE` (`VALIDACION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: La recomendación no existe o no es tuya (`NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
  /api/actividades/extraer:
    post:
      tags: [Actividades]
      operationId: extraerActividad
      summary: Extrae los datos de una actividad descrita en lenguaje natural.
      description: |
        El modelo recibe una sola función, `registrar_actividad`, y está obligado a llamarla: sus argumentos son el JSON con la
        actividad. Qué datos son válidos lo decide el servidor: hora de hoy entre 07:15 y 21:00 (hora de Bolivia), duración de
        10 a 240 minutos que no pase de las 21:00, y de 2 a 30 personas contando a quien la crea. Un dato que falta o no es
        válido va en `faltantes` y `mensaje` trae la pregunta por el primero. Si no dice la hora, empieza ahora y `supuestos` lo indica.

        Para responder la pregunta se vuelve a llamar con `texto` = la respuesta y `anterior` = el campo `actividad` de la
        respuesta anterior. El texto pasa por los guardrails de HU17 y toda extracción queda en la auditoría con tipo `EXTRACCION_COMUNIDAD`.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudExtraccionDto'
            examples:
              primeraConsulta:
                summary: Primera consulta
                value:
                  texto: Quiero jugar cartas a las 4 por una hora
                  anterior: null
              respuesta:
                summary: Respuesta a la pregunta por un dato faltante
                value:
                  texto: una hora con 2 amigos
                  anterior: { actividad: tomar un café, horaInicio: '17:00', duracionMin: null, maxParticipantes: null }
      responses:
        '200':
          description: Datos extraídos (`COMPLETO`, `INCOMPLETO` o `NO_ENTENDIDO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaExtraccionDto'
              examples:
                completa:
                  summary: Están todos los datos
                  value:
                    consultaId: 58
                    estado: COMPLETO
                    mensaje: null
                    actividad: { actividad: jugar cartas, horaInicio: '16:00', duracionMin: 60, maxParticipantes: 4 }
                    faltantes: []
                    supuestos: []
                incompleta:
                  summary: Falta algún dato
                  value:
                    consultaId: 59
                    estado: INCOMPLETO
                    mensaje: '¿Cuánto tiempo va a durar la actividad?'
                    actividad: { actividad: tomar un café, horaInicio: '17:00', duracionMin: null, maxParticipantes: null }
                    faltantes: [duracionMin, maxParticipantes]
                    supuestos: []
                noEntendida:
                  summary: No se reconoce ninguna actividad
                  value:
                    consultaId: 60
                    estado: NO_ENTENDIDO
                    mensaje: 'No entendimos tu actividad, ¿puedes describirla con más detalle?'
                    actividad: { actividad: null, horaInicio: null, duracionMin: null, maxParticipantes: null }
                    faltantes: [actividad]
                    supuestos: []
        '400':
          description: Falta el texto o supera los 200 caracteres (`codigo` = `VALIDACION`), o no pasa los guardrails de HU17 (`codigo` = `SOLICITUD_NO_PERMITIDA`, queda en la auditoría como `RECHAZADO_SEGURIDAD`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
              example:
                codigo: SOLICITUD_NO_PERMITIDA
                mensaje: Solo puedo recomendar actividades académicas y respetuosas, dentro del reglamento de la universidad.
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '503':
          description: El modelo no respondió (`codigo` = `ASISTENTE_NO_DISPONIBLE`). La extracción queda registrada como `ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
              example:
                codigo: ASISTENTE_NO_DISPONIBLE
                mensaje: El asistente no está disponible en este momento. Intenta de nuevo en unos minutos.
  /api/actividades/revisar:
    post:
      tags: [Actividades]
      operationId: revisarActividad
      summary: Revisa los datos de una actividad que el estudiante corrigió a mano, sin llamar a la IA.
      description: |
        Sirve cuando la IA entendió mal y el estudiante edita las casillas del resumen. Se aplican las mismas reglas que en
        `POST /api/actividades/extraer` y la respuesta tiene el mismo formato: con `COMPLETO`, su `consultaId` es el que se
        manda a `POST /api/actividades` para crear la actividad (HU10). Queda en la auditoría con modelo `manual`.
        Para corregir en palabras se usa `POST /api/actividades/extraer` con `anterior`.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevisionActividadDto'
            example:
              texto: Quiero jugar cartas por una hora
              actividad: { actividad: jugar ajedrez, horaInicio: '17:00', duracionMin: 90, maxParticipantes: 2 }
      responses:
        '200':
          description: Datos revisados (`COMPLETO`, o `INCOMPLETO` con la pregunta en `mensaje`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaExtraccionDto'
              example:
                consultaId: 61
                estado: COMPLETO
                mensaje: null
                actividad: { actividad: jugar ajedrez, horaInicio: '17:00', duracionMin: 90, maxParticipantes: 2 }
                faltantes: []
                supuestos: []
        '400':
          description: Falta la descripción o la actividad (`codigo` = `VALIDACION`), o no pasa los guardrails de HU17 (`codigo` = `SOLICITUD_NO_PERMITIDA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
              example:
                codigo: VALIDACION
                mensaje: Escribe qué actividad vas a hacer.
        '401':
          $ref: '#/components/responses/NoAutorizado'
  /api/actividades:
    post:
      tags: [Actividades]
      operationId: crearActividad
      summary: Crea la actividad que el estudiante confirmó (HU10).
      description: |
        Se llama cuando el estudiante revisa el resumen de `POST /api/actividades/extraer` (estado `COMPLETO`) y pulsa «Confirmar y crear».
        Guarda una comunidad con `log_id` = `consultaId`. El servidor vuelve a validar con las reglas de la extracción (hora de hoy entre
        07:15 y 21:00 en hora de Bolivia, duración de 10 a 240 minutos que no pase de las 21:00, de 2 a 30 personas), comprueba que la
        extracción sea del propio usuario y esté completa, y que no se haya usado antes. El texto y la actividad pasan por los guardrails de HU17.

        HU13: recién creada, se invita automáticamente a los compañeros de la sede libres a esa hora (reglas del matching de
        HU12), uno por lugar libre, y cada uno recibe un aviso `INVITACION_COMUNIDAD`. El resultado viene en `invitacion`.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearActividadRequest'
      responses:
        '201':
          description: Actividad creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ActividadCreadaDto'
        '400':
          description: Datos inválidos, consulta incompleta o de otro día (`VALIDACION`), o texto que no pasa los guardrails (`SOLICITUD_NO_PERMITIDA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
              example:
                codigo: VALIDACION
                mensaje: Esa hora ya pasó y las actividades son para hoy. ¿A qué hora quieres empezar?
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: La consulta no existe o es de otro estudiante (`NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '409':
          description: |
            Esa consulta ya se usó para crear una actividad (`DUPLICADO`, también si se confirma dos veces a la vez) o los datos
            no son los del resumen confirmado (`RESUMEN_DISTINTO`): la actividad se crea con el resumen que guardó la extracción
            (`log_auditoria_rag.datos_extraidos`), no con lo que mande el cliente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
              example:
                codigo: DUPLICADO
                mensaje: Esa actividad ya se creó.
  /api/perfil:
    get:
      tags: [Perfil]
      operationId: obtenerPerfil
      summary: Devuelve el perfil del usuario autenticado.
      security:
        - Bearer: []
      responses:
        '200':
          description: Nombre, correo institucional, rol, carrera y semestre.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: La cuenta no existe o está dada de baja (`codigo` = `NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
    put:
      tags: [Perfil]
      operationId: actualizarPerfil
      summary: Actualiza nombre, carrera y semestre.
      description: |
        Nombre obligatorio (hasta 100 caracteres); carrera (hasta 80) y semestre (1 a 10) opcionales.
        Si se envía `correo` o `rol` distintos a los actuales, se rechaza con `NO_EDITABLE`.
        El cambio queda en `historial_cambio` con los valores de antes y de después.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPerfilRequest'
      responses:
        '200':
          description: Perfil actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PerfilDto'
        '400':
          description: Datos inválidos (`VALIDACION`) o intento de cambiar correo o rol (`NO_EDITABLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
  /api/matching:
    get:
      tags: [Matching]
      operationId: buscarCompaneros
      summary: Compañeros con tiempo libre compatible con uno de tus puentes.
      description: |
        Cruce por franja horaria: mismo día y 30 minutos o más en común. Orden por compatibilidad: más minutos en común
        primero; en empate, más franjas compartidas en la semana. Solo cruza estudiantes de tu sede activa que aceptaron
        aparecer, y exige que tú también lo hayas aceptado. Siempre 200 si el puente es tuyo: mira `estado`
        (`OK`, `SIN_RESULTADOS`, `SIN_ZONA` o `NO_VISIBLE`). No devuelve correos ni ids.
      security:
        - Bearer: []
      parameters:
        - name: puenteId
          in: query
          required: true
          description: Id de uno de tus puentes (de `GET /api/puentes`).
          schema: { type: integer, format: int32, minimum: 1, example: 5 }
      responses:
        '200':
          description: Resultado del matching.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoMatchingDto'
        '400':
          description: Falta `puenteId` (`VALIDACION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: El puente no existe o no es tuyo (`NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
  /api/matching/configuracion:
    get:
      tags: [Matching]
      operationId: obtenerConfiguracionMatching
      summary: Si aceptaste que compañeros con tiempo compatible te encuentren.
      security:
        - Bearer: []
      responses:
        '200':
          description: Consentimiento actual. Por defecto, `visible` es `false`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionMatchingDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
    put:
      tags: [Matching]
      operationId: actualizarConfiguracionMatching
      summary: Acepta o retira el consentimiento para aparecer en el matching.
      description: Al aceptar se guarda la fecha; al retirarlo dejas de aparecer y tampoco ves a otros. El cambio queda en `historial_cambio`.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarConfiguracionMatchingRequest'
      responses:
        '200':
          description: Consentimiento actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionMatchingDto'
        '400':
          description: Falta `visible` (`VALIDACION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Comprueba que la API está en marcha.
      responses:
        '200':
          description: La API responde.
  /health/db:
    get:
      tags: [Health]
      operationId: healthDb
      summary: Comprueba que la API puede conectarse a la base de datos MySQL.
      responses:
        '200':
          description: Conexión a la base de datos correcta.
        '503':
          description: No se pudo conectar a la base de datos.
  /api/comunidades:
    get:
      tags: [Comunidades]
      operationId: listarComunidades
      summary: Comunidades activas de hoy (Comunidades → Descubrir).
      description: |
        Las que todavía no terminaron y son de hoy (hora de Bolivia), de la más próxima a la más lejana, como máximo 50.
        Siempre aparecen las que creaste y aquellas a las que te invitaron. Las de tus compañeros, solo si elegiste campus y
        aceptaste el matching (HU12), con el mismo consentimiento recíproco que las invitaciones de HU13. Del creador solo se
        muestra el nombre y la inicial del apellido. Para unirse o responder, `PUT /api/comunidades/{id}/asistencia` (HU14).
      security:
        - Bearer: []
      responses:
        '200':
          description: Las comunidades y el estado (`OK`, `SIN_RESULTADOS`, `SIN_ZONA` o `NO_VISIBLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoDescubrirDto'
              example:
                estado: OK
                mensaje: null
                comunidades:
                  - { id: 12, actividad: jugar cartas, horaInicio: '16:00', horaFin: '17:00', maxParticipantes: 4, confirmados: 1, creador: Ana P., esMia: false, miEstado: PENDIENTE }
        '401':
          $ref: '#/components/responses/NoAutorizado'
  /api/comunidades/{id}/invitaciones:
    post:
      tags: [Comunidades]
      operationId: invitarDeNuevo
      summary: Vuelve a buscar compañeros libres para tu actividad e invita a los que coincidan (HU13).
      description: |
        La primera búsqueda es automática al crear la actividad (`POST /api/actividades` devuelve `invitacion`). Este endpoint
        sirve para intentarlo de nuevo: después de aceptar el matching (`NO_VISIBLE`), de elegir campus (`SIN_ZONA`) o si
        antes no había nadie libre (`SIN_COINCIDENCIAS`). Mismas reglas: compañeros de tu sede que aceptaron el matching (HU12),
        con un puente hoy que comparta 30 minutos o más con la actividad (o la actividad entera, si dura menos) y que no
        estén en otra comunidad a esa hora. Se invita solo a los lugares que quedan y nunca dos veces a la misma persona.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id de tu actividad (el `id` que devolvió `POST /api/actividades`).
          schema: { type: integer, format: int32, example: 12 }
      responses:
        '200':
          description: Resultado de la búsqueda (`estado` dice qué pasó).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitacionDto'
        '400':
          description: La actividad ya terminó (`VALIDACION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: La actividad no existe o no es tuya (`NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
  /api/comunidades/{id}/asistencia:
    put:
      tags: [Comunidades]
      operationId: responderAsistencia
      summary: Confirma o rechaza tu asistencia a una comunidad, o te une desde Descubrir (HU14).
      description: |
        Responde una invitación (`PENDIENTE`), cambia de idea (`CONFIRMADO` ↔ `RECHAZADO`) o te une a una comunidad que ves en
        Descubrir. Quien la creó siempre va y no responde. No se confirma si no quedan lugares (contando a quien la creó) ni si
        a esa hora ya vas a otra comunidad; bajarse siempre se puede mientras la actividad no haya terminado. Responder lo mismo
        otra vez no cambia nada. Tus avisos de esa comunidad quedan leídos; si el grupo se llena, los invitados pendientes
        reciben `COMUNIDAD_CERRADA`, que se apaga si alguien se baja.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Id de la comunidad (el `id` de `GET /api/comunidades` o el `comunidadId` del aviso).
          schema: { type: integer, format: int32, example: 12 }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponderAsistenciaDto'
            examples:
              voy: { value: { asisto: true } }
              noVoy: { value: { asisto: false } }
      responses:
        '200':
          description: Tu respuesta quedó guardada (o ya era esa).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AsistenciaDto'
        '400':
          description: Falta `asisto`, eres quien la creó, la actividad ya terminó o rechazas una comunidad en la que no estás (`VALIDACION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: La comunidad no existe, está archivada o no la puedes ver (`NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '409':
          description: No quedan lugares (`COMPLETA`) o a esa hora ya vas a otra comunidad (`CRUCE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
              example: { codigo: CRUCE, mensaje: 'A esa hora ya vas a «estudiar Redes» (10:30–11:30).' }
  /api/comunidades/{id}/participantes:
    get:
      tags: [Comunidades]
      operationId: listarParticipantes
      summary: Quiénes van a una comunidad (HU14).
      description: |
        Quien la creó ve a todos (los que van, los pendientes y los que no van) con nombre completo y carrera. Un invitado o
        participante ve solo a quienes van, con nombre e inicial del apellido, y a sí mismo («Tú»). Orden: quien la creó, los
        que van, los pendientes y los que no van.
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer, format: int32, example: 12 }
      responses:
        '200':
          description: La lista de participantes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParticipantesDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: La comunidad no existe, está archivada o no estás en ella (`NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
  /api/reportes/lugares:
    get:
      tags: [Reportes]
      operationId: listarLugaresReportables
      summary: Lugares activos que se pueden reportar (para el selector del formulario).
      security: [{ Bearer: [] }]
      responses:
        '200':
          description: Lugares por nombre.
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: integer, format: int32, example: 4 }
                    nombre: { type: string, example: Biblioteca Central }
        '401':
          $ref: '#/components/responses/NoAutorizado'
  /api/reportes:
    post:
      tags: [Reportes]
      operationId: crearReporte
      summary: Envía un reporte (queda pendiente y lo revisa un administrador).
      description: |
        `ERROR_APP` y `SUGERENCIA` van sin lugar; `LUGAR_INCORRECTO` lleva `lugarId`. La descripción tiene de 10 a 500
        caracteres. Un mismo lugar no se reporta otra vez mientras siga pendiente, y cada estudiante tiene como mucho 3 pendientes.
      security: [{ Bearer: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NuevoReporteDto'
      responses:
        '201':
          description: Reporte recibido.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: integer, format: int32, example: 12 }
                  estado: { type: string, example: PENDIENTE }
        '400':
          description: Falta un dato o no es válido (`VALIDACION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: El lugar no existe (`NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '409':
          description: Ya reportaste ese lugar y sigue pendiente (`YA_REPORTADO`), o ya tienes 3 pendientes (`DEMASIADOS_PENDIENTES`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido en `POST /api/auth/login` o `POST /api/auth/register`. Pégalo sin la palabra `Bearer`.
  responses:
    NoAutorizado:
      description: Falta el token, es inválido o está vencido. Sin cuerpo.
    BloqueNoEncontrado:
      description: El bloque no existe o no pertenece al usuario (`codigo` = `NO_ENCONTRADO`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorNegocioDto'
          example:
            codigo: NO_ENCONTRADO
            mensaje: El bloque no existe.
    Duplicado:
      description: Ya existe la misma materia ese día a esa hora de inicio (`codigo` = `DUPLICADO`). Un choque con otra materia no es error.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorNegocioDto'
          example:
            codigo: DUPLICADO
            mensaje: Ya registraste «Cálculo I» a esa hora ese día.
    DatosInvalidos:
      description: |
        Datos inválidos. Hay dos formas de respuesta:
        - Regla de negocio incumplida: `{ "codigo": "VALIDACION", "mensaje": "..." }` (`ErrorNegocioDto`).
        - Cuerpo mal formado o con campos faltantes: `ValidationProblemDetails` estándar de ASP.NET.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorNegocioDto'
              - $ref: '#/components/schemas/ValidationProblemDetails'
          examples:
            horaFinInvalida:
              summary: La hora de fin no es posterior a la de inicio
              value:
                codigo: VALIDACION
                mensaje: La hora de fin tiene que ser posterior a la hora de inicio.
            formatoDeHora:
              summary: Hora con formato no admitido
              value:
                codigo: VALIDACION
                mensaje: Las horas deben tener formato HH:mm o HH:mm:ss.
            diaFueraDeRango:
              summary: Día fuera de 1 a 6
              value:
                codigo: VALIDACION
                mensaje: El día debe ir de 1 (lunes) a 6 (sábado).
            materiaVacia:
              summary: Materia vacía
              value:
                codigo: VALIDACION
                mensaje: La materia es obligatoria.
  schemas:
    LoginRequestDto:
      type: object
      description: Credenciales para iniciar sesión.
      required: [email, password]
      properties:
        email:
          type: string
          description: Correo institucional. Solo se aceptan direcciones `usuario@ucb.edu.bo`.
          example: dev.estudiante@ucb.edu.bo
        password:
          type: string
          format: password
          description: Contraseña de la cuenta.
          example: Breaku-Dev-2026!
    RegisterRequestDto:
      type: object
      description: Datos para crear una cuenta de estudiante.
      required: [nombre, email, password]
      properties:
        nombre:
          type: string
          description: Nombre completo del estudiante.
          example: Ana Pérez
        email:
          type: string
          description: Correo institucional. Solo se aceptan direcciones `usuario@ucb.edu.bo` y no puede estar ya registrado.
          example: ana.perez@ucb.edu.bo
        password:
          type: string
          format: password
          description: Contraseña de la cuenta. Se guarda con hash BCrypt.
          example: MiClaveSegura-2026
    AuthResponseDto:
      type: object
      description: Sesión iniciada. Token JWT y datos básicos del usuario.
      properties:
        token:
          type: string
          description: 'Token JWT (HS256, vigencia de 24 horas). Claims `sub` (id del usuario), `email`, `nombre` y `role` (`ESTUDIANTE` o `ADMIN`). Se envía en `Authorization: Bearer {token}`.'
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI3In0.firma
        userId:
          type: integer
          format: int32
          description: Identificador del usuario.
          example: 7
        nombre:
          type: string
          description: Nombre completo del usuario.
          example: Ana Pérez
        email:
          type: string
          description: Correo institucional del usuario.
          example: ana.perez@ucb.edu.bo
        rol:
          type: string
          enum: [ESTUDIANTE, ADMIN]
          description: Rol del usuario. El frontend lo usa para mostrar el panel de administración.
          example: ESTUDIANTE
    ErrorMensajeDto:
      type: object
      description: Error de autenticación (login y registro).
      properties:
        message:
          type: string
          description: Mensaje en español, listo para mostrar al usuario.
          example: Solo se permite el acceso con un correo institucional (@ucb.edu.bo)
    ErrorNegocioDto:
      type: object
      description: Error de negocio (horarios, notificaciones y recomendaciones).
      properties:
        codigo:
          type: string
          enum: [VALIDACION, DUPLICADO, NO_ENCONTRADO, SOLICITUD_NO_PERMITIDA, ASISTENTE_NO_DISPONIBLE]
          description: '`VALIDACION` (400), `DUPLICADO` (409), `NO_ENCONTRADO` (404), `SOLICITUD_NO_PERMITIDA` (400) o `ASISTENTE_NO_DISPONIBLE` (503).'
          example: DUPLICADO
        mensaje:
          type: string
          description: Mensaje en español, listo para mostrar al usuario.
          example: Ya registraste «Cálculo I» a esa hora ese día.
    ValidationProblemDetails:
      type: object
      description: Error de validación estándar de ASP.NET (cuerpo mal formado o campos faltantes).
      properties:
        type:
          type: string
          nullable: true
          example: https://tools.ietf.org/html/rfc9110#section-15.5.1
        title:
          type: string
          nullable: true
          example: One or more validation errors occurred.
        status:
          type: integer
          format: int32
          nullable: true
          example: 400
        errors:
          type: object
          description: Campo → lista de mensajes.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            req: [El campo req es obligatorio.]
    GuardarHorarioRequest:
      type: object
      description: Datos de un bloque de clase. Sirve para crear (POST) y para reemplazar (PUT) un bloque.
      required: [materia, diaSemana, horaInicio, horaFin]
      properties:
        materia:
          type: string
          minLength: 1
          maxLength: 100
          description: Nombre de la materia. Obligatorio, hasta 100 caracteres (se recortan los espacios de los extremos).
          example: Cálculo I
        diaSemana:
          type: integer
          format: int32
          minimum: 1
          maximum: 6
          description: 'Día de la semana: 1 = lunes … 6 = sábado.'
          example: 1
        horaInicio:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$'
          description: Hora de inicio en formato 24 h (`HH:mm` o `HH:mm:ss`). De 07:15 a 20:15 (horario de clases de la UCB).
          example: '08:00'
        horaFin:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$'
          description: Hora de fin en formato 24 h (`HH:mm` o `HH:mm:ss`). De 08:00 a 21:00, y la clase dura al menos 45 minutos.
          example: '09:30'
        aula:
          type: string
          nullable: true
          maxLength: 30
          description: Aula (opcional, hasta 30 caracteres). Si llega vacía se guarda como `null`.
          example: A-101
        asiste:
          type: boolean
          nullable: true
          description: Si el estudiante asiste a este bloque. Si no se envía, es `true` al crear y se conserva el valor actual al editar.
          example: true
        autorizacionCarrera:
          type: boolean
          nullable: true
          description: El estudiante confirma que su carrera autoriza que este bloque coincida con otro. Opcional; si no se envía se conserva el valor actual.
          example: false
    HorarioDto:
      type: object
      description: Bloque de clase del estudiante.
      properties:
        id:
          type: integer
          format: int32
          description: Identificador del bloque.
          example: 12
        materia:
          type: string
          description: Nombre de la materia.
          example: Cálculo I
        diaSemana:
          type: integer
          format: int32
          description: 'Día de la semana: 1 = lunes … 6 = sábado.'
          example: 1
        horaInicio:
          type: string
          description: Hora de inicio (`HH:mm:ss`, 24 h).
          example: '08:00:00'
        horaFin:
          type: string
          description: Hora de fin (`HH:mm:ss`, 24 h).
          example: '09:30:00'
        aula:
          type: string
          nullable: true
          description: Aula, o `null` si no se indicó.
          example: A-101
        origen:
          type: string
          enum: [MANUAL, FOTO]
          description: 'Cómo se cargó el bloque: `MANUAL` o `FOTO`. El cliente no lo envía.'
          example: MANUAL
        asiste:
          type: boolean
          description: Si el estudiante asiste a este bloque. Si es `false` no cuenta como tiempo ocupado y no choca con otros.
          example: true
        autorizacionCarrera:
          type: boolean
          description: El estudiante confirmó que su carrera autoriza el choque.
          example: false
        coincide:
          type: array
          description: Bloques del mismo día que se cruzan con éste, asista o no el estudiante (sirve para preguntarle a cuál asiste).
          items:
            $ref: '#/components/schemas/CoincidenciaDto'
        advertencias:
          type: array
          description: Un aviso por cada bloque con el que choca de verdad (el estudiante asiste a los dos). No impiden guardar.
          items:
            type: string
          example: ['Coincide con «MAT-241» (14:15-15:45).']
    CoincidenciaDto:
      type: object
      description: Otro bloque del mismo día que se cruza con el consultado.
      properties:
        id: { type: integer, format: int32, example: 13 }
        materia: { type: string, example: MAT-241 }
        horaInicio: { type: string, example: '14:15:00' }
        horaFin: { type: string, example: '15:45:00' }
        asiste: { type: boolean, example: true }
    CambiarAsistenciaRequest:
      type: object
      required: [asiste]
      properties:
        asiste: { type: boolean, example: false }
        autorizacionCarrera: { type: boolean, nullable: true, description: Opcional; si no se envía se conserva el valor actual., example: true }
    CambiarAsistenciasRequest:
      type: object
      required: [bloques]
      properties:
        bloques:
          type: array
          maxItems: 40
          items:
            type: object
            required: [id, asiste]
            properties:
              id: { type: integer, format: int32, example: 12 }
              asiste: { type: boolean, example: false }
              autorizacionCarrera: { type: boolean, nullable: true, example: true }
    PuenteDto:
      type: object
      description: Tiempo libre detectado. `ENTRE_CLASES` es un hueco de 45 minutos o más entre dos clases del mismo día; `DESPUES_DE_CLASES` va desde la última clase del día hasta las 21:00, si son 45 minutos o más.
      properties:
        id:
          type: integer
          format: int32
          description: Identificador del puente.
          example: 5
        diaSemana:
          type: integer
          format: int32
          description: 'Día de la semana: 1 = lunes … 6 = sábado.'
          example: 1
        horaInicio:
          type: string
          description: Hora en que termina la clase anterior (`HH:mm:ss`, 24 h).
          example: '09:30:00'
        horaFin:
          type: string
          description: Hora en que empieza la clase siguiente (`HH:mm:ss`, 24 h).
          example: '10:30:00'
        tipo:
          type: string
          enum: [ENTRE_CLASES, DESPUES_DE_CLASES]
          description: Si el tiempo libre está entre dos clases o después de la última del día.
          example: ENTRE_CLASES
    NotificacionDto:
      type: object
      description: Aviso para el estudiante. `PUENTE_DISPONIBLE` y `DESPUES_DE_CLASES` (HU4), `INVITACION_COMUNIDAD` (HU13) o `COMUNIDAD_CERRADA` (HU14).
      properties:
        id:
          type: integer
          format: int64
          description: Identificador de la notificación.
          example: 31
        tipo:
          type: string
          enum: [PUENTE_DISPONIBLE, DESPUES_DE_CLASES, INVITACION_COMUNIDAD, COMUNIDAD_CERRADA]
          description: Tipo de aviso.
          example: PUENTE_DISPONIBLE
        mensaje:
          type: string
          description: Texto listo para mostrar al usuario.
          example: ¡Puente disponible! Tienes 1 h 30 min libres, de 10:00 a 11:30.
        fecha:
          type: string
          format: date
          nullable: true
          description: Día del puente (`yyyy-MM-dd`, hora de Bolivia). `null` si no es un aviso de puente.
          example: '2026-10-22'
        horaInicio:
          type: string
          nullable: true
          description: Inicio del puente (`HH:mm:ss`). `null` si no es un aviso de puente.
          example: '10:00:00'
        horaFin:
          type: string
          nullable: true
          description: Fin del puente (`HH:mm:ss`). `null` si no es un aviso de puente.
          example: '11:30:00'
        duracionMinutos:
          type: integer
          format: int32
          nullable: true
          description: Duración disponible del puente en minutos. `null` si no es un aviso de puente.
          example: 90
        leida:
          type: boolean
          description: Si el usuario ya la marcó como leída.
          example: false
        creadaEn:
          type: string
          format: date-time
          description: Momento del envío (UTC).
          example: '2026-10-22T14:00:04.512Z'
        comunidadId:
          type: integer
          format: int32
          nullable: true
          description: HU13. La comunidad a la que invita (`INVITACION_COMUNIDAD`). `null` en los avisos de puente.
          example: null
    ConfiguracionNotificacionesDto:
      type: object
      description: Preferencia de avisos del usuario.
      required: [notificacionesActivas]
      properties:
        notificacionesActivas:
          type: boolean
          description: '`true` = recibe avisos de puente. `false` = no recibe ninguno, aunque sus puentes se siguen detectando.'
          example: true
    SolicitudRecomendacionDto:
      type: object
      description: Pedido de recomendación para un puente del usuario.
      required: [puenteId]
      properties:
        puenteId:
          type: integer
          format: int32
          description: Puente del usuario para el que se busca qué hacer (ver `GET /api/puentes`).
          example: 5
        entrada:
          type: string
          nullable: true
          maxLength: 300
          description: Preferencia libre del estudiante (opcional).
          example: Estoy cansado, quiero algo tranquilo
    RespuestaRecomendacionDto:
      type: object
      description: Resultado de la consulta al asistente.
      properties:
        consultaId:
          type: integer
          format: int64
          description: Identificador del registro de auditoría de esta consulta.
          example: 42
        estado:
          type: string
          enum: [OK, SIN_RESULTADOS]
          description: '`OK` = hay recomendaciones. `SIN_RESULTADOS` = no hay; se muestra `mensaje`.'
          example: OK
        mensaje:
          type: string
          nullable: true
          description: Texto para mostrar cuando no hay recomendaciones. `null` si las hay.
          example: No encontramos opciones cercanas para este tiempo disponible.
        recomendaciones:
          type: array
          description: De la más a la menos adecuada (máximo 3). Vacía si `estado` = `SIN_RESULTADOS`.
          items:
            $ref: '#/components/schemas/RecomendacionDto'
    RecomendacionDto:
      type: object
      description: Una recomendación. Todos los datos salen del catálogo; del asistente solo sale `explicacion`.
      properties:
        id:
          type: integer
          format: int64
          description: Identificador de la recomendación.
          example: 87
        lugarId:
          type: integer
          format: int32
          description: Lugar del catálogo que respalda la recomendación.
          example: 2
        nombre:
          type: string
          description: Nombre del lugar, tal como está en el catálogo.
          example: Biblioteca Central
        categoria:
          type: string
          description: Categoría del lugar.
          example: Estudio
        distanciaM:
          type: integer
          format: int32
          description: Distancia desde la zona del estudiante, en metros.
          example: 200
        tiempoTrasladoMin:
          type: integer
          format: int32
          description: Tiempo de traslado de ida y vuelta, en minutos.
          example: 6
        duracionEstimadaMin:
          type: integer
          format: int32
          description: Tiempo estimado de la actividad en el lugar, en minutos.
          example: 30
        explicacion:
          type: string
          description: Por qué encaja, redactado por el asistente.
          example: Ideal para repasar en silencio antes de tu próxima clase.
        feedback:
          type: string
          nullable: true
          enum: [LIKE, DISLIKE]
          description: Valoración del estudiante (HU9), o `null` si todavía no valoró.
          example: null
        fotoUrl:
          type: string
          nullable: true
          description: Ruta de la foto real del lugar (relativa a la API, con `?v=` de versión). `null` si no tiene foto; el frontend muestra la ilustración de la categoría.
          example: /api/lugares/12/foto?v=639034123456789010
    FeedbackRecomendacionDto:
      type: object
      required: [feedback]
      properties:
        feedback: { type: string, enum: [LIKE, DISLIKE], description: No distingue mayúsculas., example: LIKE }
    FeedbackGuardadoDto:
      type: object
      properties:
        recomendacionId: { type: integer, format: int64, example: 87 }
        feedback: { type: string, enum: [LIKE, DISLIKE], example: LIKE }
        fechaFeedback: { type: string, format: date-time, example: '2026-10-31T14:00:04.512Z' }
    ZonaDto:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        nombre:
          type: string
          example: Campus central
    EstadoUbicacionDto:
      type: object
      required: [consentimientoActivo, zonaActual]
      properties:
        consentimientoActivo:
          type: boolean
          description: Indica si el estudiante autorizó compartir ubicación del dispositivo.
          example: false
        zonaActual:
          allOf:
            - $ref: '#/components/schemas/ZonaDto'
          nullable: true
          description: Campus elegido o detectado, o `null` si no se ha seleccionado.
    CompartirUbicacionRequest:
      type: object
      required: [latitud, longitud]
      properties:
        latitud:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: -16.5
        longitud:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -68.15
    SeleccionarZonaRequest:
      type: object
      required: [zonaId]
      properties:
        zonaId:
          type: integer
          format: int32
          minimum: 1
          example: 1
    LugarViableDto:
      type: object
      required: [lugarId, nombre, categoria, distanciaM, tiempoTrasladoMin, duracionEstimadaMin]
      properties:
        lugarId:
          type: integer
          format: int32
          example: 2
        nombre:
          type: string
          example: Biblioteca Central
        categoria:
          type: string
          example: Estudio
        descripcion:
          type: string
          nullable: true
          example: Salas silenciosas y computadoras para estudiar.
        distanciaM:
          type: integer
          format: int32
          description: Distancia en línea recta desde el campus, en metros.
          example: 120
        tiempoTrasladoMin:
          type: integer
          format: int32
          description: Minutos de traslado caminando, de ida y vuelta.
          example: 3
        duracionEstimadaMin:
          type: integer
          format: int32
          description: Minutos que lleva la actividad en el lugar.
          example: 45
        validado:
          type: boolean
          description: '`false` si el equipo todavía no revisó los datos del lugar; la app lo muestra como «Por validar».'
          example: false
        tipoLugar:
          type: string
          nullable: true
          description: Tipo de lugar según el relevamiento.
          example: campus
        modalidad:
          type: array
          items: { type: string }
          example: [solitario, grupal]
        nivelEnergia:
          type: array
          items: { type: string }
          example: [bajo]
        actividadesSugeridas:
          type: array
          items: { type: string }
          example: [estudiar, leer]
        fotoUrl:
          type: string
          nullable: true
          description: Ruta de la foto real del lugar (relativa a la API, con `?v=` de versión). `null` si no tiene foto; el frontend muestra la ilustración de la categoría.
          example: /api/lugares/12/foto?v=639034123456789010
    ResultadoBusquedaLugaresDto:
      type: object
      required: [estado, minutosDisponibles, lugares]
      properties:
        estado:
          type: string
          enum: [OK, SIN_RESULTADOS, SIN_ZONA]
          example: OK
        mensaje:
          type: string
          nullable: true
          description: Texto para mostrar cuando el estado no es `OK`.
        zona:
          allOf:
            - $ref: '#/components/schemas/ZonaDto'
          nullable: true
          description: Campus usado como origen; `null` con `SIN_ZONA`.
        radioAplicadoM:
          type: integer
          format: int32
          nullable: true
          example: 800
        minutosDisponibles:
          type: integer
          format: int32
          description: Duración del puente consultado, en minutos.
          example: 110
        lugares:
          type: array
          items:
    ResumenAdminDto:
      type: object
      properties:
        lugaresActivos: { type: integer, format: int32, example: 6 }
        lugaresEnRevision: { type: integer, format: int32, example: 1 }
        estudiantes: { type: integer, format: int32, example: 3 }
        comunidadesHoy: { type: integer, format: int32, example: 0 }
        consultasRagSemana: { type: integer, format: int32, example: 18 }
        reportesPendientes: { type: integer, format: int32, example: 0 }
    GuardarLugarDto:
      type: object
      required: [nombre, categoriaId, latitud, longitud, duracionEstimadaMin]
      properties:
        nombre: { type: string, minLength: 3, maxLength: 100, example: Sala de Estudio Norte, description: Único en el catálogo. }
        descripcion: { type: string, nullable: true, maxLength: 500, example: Mesas grandes y enchufes }
        categoriaId: { type: integer, format: int32, example: 2 }
        latitud: { type: number, example: -17.3716, description: Dentro del radio de un campus activo. }
        longitud: { type: number, example: -66.1439 }
        duracionEstimadaMin: { type: integer, format: int32, minimum: 1, maximum: 240, example: 40 }
        horaApertura: { type: string, nullable: true, example: '08:00', description: '`HH:mm`; va junto con `horaCierre`.' }
        horaCierre: { type: string, nullable: true, example: '20:00', description: Después de la apertura. }
        minAPieDesdeBloqueA: { type: integer, format: int32, nullable: true, minimum: 0, maximum: 60, example: 3 }
    LugarDetalleAdminDto:
      allOf:
        - $ref: '#/components/schemas/GuardarLugarDto'
        - type: object
          properties:
            id: { type: integer, format: int32, example: 21 }
            estado: { type: string, enum: [ACTIVO, EN_REVISION, INACTIVO], example: ACTIVO }
            validado: { type: boolean, example: true }
            fotoUrl: { type: string, nullable: true, description: 'Ruta de la foto actual, o null si no tiene.', example: '/api/lugares/21/foto?v=639034123456789010' }
    FotoGuardadaDto:
      type: object
      description: Foto guardada.
      properties:
        fotoUrl: { type: string, description: Ruta de la foto con la versión nueva (relativa a la API)., example: '/api/lugares/21/foto?v=639034123456789010' }
    NuevoReporteDto:
      type: object
      required: [motivo, descripcion]
      properties:
        motivo: { type: string, enum: [ERROR_APP, SUGERENCIA, LUGAR_INCORRECTO], example: LUGAR_INCORRECTO }
        lugarId: { type: integer, format: int32, nullable: true, example: 4, description: Solo con `LUGAR_INCORRECTO`. }
        descripcion: { type: string, minLength: 10, maxLength: 500, example: El horario dice que abre a las 7, pero abre a las 9. }
    LugarAdminDto:
      type: object
      properties:
        id: { type: integer, format: int32, example: 6 }
        nombre: { type: string, example: Biblioteca Central }
        categoria: { type: string, example: Estudio }
        estado: { type: string, enum: [ACTIVO, EN_REVISION, INACTIVO], example: ACTIVO }
        duracionEstimadaMin: { type: integer, format: int32, example: 45 }
        horaApertura: { type: string, nullable: true, description: 'HH:mm', example: '07:00' }
        horaCierre: { type: string, nullable: true, description: 'HH:mm', example: '21:00' }
        vecesRecomendado: { type: integer, format: int32, example: 15 }
        validado: { type: boolean, description: 'false: datos del relevamiento que el equipo todavía no revisó.', example: false }
        recomendable: { type: boolean, description: 'false: punto de referencia (campus, parqueo, bloques), nunca se recomienda.', example: true }
        tipoLugar: { type: string, nullable: true, example: comida }
    CambioEstadoLugarDto:
      type: object
      required: [estado]
      properties:
        estado: { type: string, enum: [ACTIVO, EN_REVISION, INACTIVO], example: INACTIVO }
    CambioValidacionLugarDto:
      type: object
      required: [validado]
      properties:
        validado: { type: boolean, example: true }
    ResolverReporteDto:
      type: object
      required: [estado]
      properties:
        estado: { type: string, enum: [RESUELTO, DESCARTADO], example: RESUELTO, description: Decisión del administrador. }
    ReporteAdminDto:
      type: object
      properties:
        id: { type: integer, format: int32 }
        motivo: { type: string, example: INFORMACION_INCORRECTA }
        descripcion: { type: string, nullable: true }
        estado: { type: string, enum: [PENDIENTE, RESUELTO, DESCARTADO] }
        objeto: { type: string, description: Nombre del lugar o actividad de la comunidad reportada., example: Cafetería Central }
        autor: { type: string, example: Ana Pérez }
        creadoEn: { type: string, format: date-time }
    ConsultaRagAdminDto:
      type: object
      properties:
        id: { type: integer, format: int64, example: 18 }
        fecha: { type: string, format: date-time }
        usuario: { type: string, example: Ana Pérez }
        tipo: { type: string, example: RECOMENDACION }
        entrada: { type: string, nullable: true, example: Una plática con café }
        estado: { type: string, enum: [OK, SIN_RESULTADOS, RECHAZADO_SEGURIDAD, ERROR, INCOMPLETO] }
        motivoRechazo:
          type: string
          nullable: true
          enum: [INYECCION, FUERA_DE_ALCANCE, BIENESTAR, FUERA_DE_REGLAMENTO, FUERA_DE_CONTEXTO, null]
          example: INYECCION
          description: HU17. Con `RECHAZADO_SEGURIDAD`, por qué se rechazó. `null` en los demás estados y en rechazos anteriores a la HU17.
        modelo: { type: string, nullable: true, example: 'qwen2.5:3b' }
        latenciaMs: { type: integer, format: int32, nullable: true, example: 23494 }
        lugaresRecuperados: { type: integer, format: int32, example: 5 }
        recomendados: { type: integer, format: int32, example: 3 }
    MetricasAdminDto:
      type: object
      properties:
        consultasTotales: { type: integer, format: int32, example: 18 }
        ok: { type: integer, format: int32, example: 16 }
        sinResultados: { type: integer, format: int32, example: 0 }
        rechazadas: { type: integer, format: int32, example: 0 }
        errores: { type: integer, format: int32, example: 2 }
        latenciaPromedioMs: { type: integer, format: int32, nullable: true, example: 23494 }
        masRecomendados:
          type: array
          items:
            type: object
            properties:
              nombre: { type: string, example: Biblioteca Central }
              categoria: { type: string, example: Estudio }
              veces: { type: integer, format: int32, example: 15 }
              meGusta: { type: integer, format: int32, example: 6, description: Valoraciones LIKE del lugar (HU9). }
              noMeSirve: { type: integer, format: int32, example: 1, description: Valoraciones DISLIKE del lugar (HU9). }
        meGusta: { type: integer, format: int32, example: 9, description: Valoraciones LIKE registradas en los últimos 7 días (HU9). }
        noMeSirve: { type: integer, format: int32, example: 2, description: Valoraciones DISLIKE registradas en los últimos 7 días (HU9). }
        rechazosPorMotivo:
          type: array
          description: HU17. Rechazos de seguridad de los últimos 7 días por motivo (`SIN_MOTIVO` = anteriores a la HU17).
          items:
            type: object
            properties:
              motivo: { type: string, example: INYECCION }
              cantidad: { type: integer, format: int32, example: 3 }
    ClaseLeidaDto:
      type: object
      properties:
        materia: { type: string, example: Cálculo II }
        diaSemana: { type: integer, format: int32, minimum: 1, maximum: 6, example: 2 }
        horaInicio: { type: string, description: 'HH:mm', example: '07:30' }
        horaFin: { type: string, description: 'HH:mm', example: '09:00' }
        aula: { type: string, nullable: true, example: A-101 }
    LecturaFotoHorarioDto:
      type: object
      properties:
        clases:
          type: array
          items:
            $ref: '#/components/schemas/ClaseLeidaDto'
        descartadas: { type: integer, format: int32, example: 1 }
    ResultadoLoteDto:
      type: object
      properties:
        guardados:
          type: array
          items:
            $ref: '#/components/schemas/HorarioDto'
        rechazados:
          type: array
          items:
            type: object
            properties:
              indice: { type: integer, format: int32, example: 1 }
              materia: { type: string, example: Física II }
              motivo: { type: string, example: 'Ya registraste «Cálculo II» a esa hora ese día.' }
    PerfilDto:
      type: object
      properties:
        nombre: { type: string, example: Ana Pérez }
        correo: { type: string, example: ana.perez@ucb.edu.bo }
        rol: { type: string, enum: [ESTUDIANTE, ADMIN] }
        carrera: { type: string, nullable: true, example: Ingeniería de Sistemas }
        semestre: { type: integer, format: int32, nullable: true, minimum: 1, maximum: 10, example: 5 }
    ActualizarPerfilRequest:
      type: object
      required: [nombre]
      properties:
        nombre: { type: string, maxLength: 100, example: Ana Pérez }
        carrera: { type: string, nullable: true, maxLength: 80, example: Ingeniería de Sistemas }
        semestre: { type: integer, format: int32, nullable: true, minimum: 1, maximum: 10, example: 5 }
        correo: { type: string, nullable: true, description: No editable; si llega distinto al actual responde NO_EDITABLE. }
        rol: { type: string, nullable: true, description: No editable; si llega distinto al actual responde NO_EDITABLE. }
    ConfiguracionMatchingDto:
      type: object
      properties:
        visible: { type: boolean, example: true }
        desde: { type: string, format: date-time, nullable: true, example: '2026-10-31T14:00:04.512Z' }
    ActualizarConfiguracionMatchingRequest:
      type: object
      required: [visible]
      properties:
        visible: { type: boolean, example: true }
    CompaneroCompatibleDto:
      type: object
      properties:
        nombre: { type: string, example: Ana Quiroga }
        carrera: { type: string, nullable: true, example: Ingeniería de Sistemas }
        semestre: { type: integer, format: int32, nullable: true, example: 5 }
        horaInicio: { type: string, example: '09:30:00', description: Inicio del tramo en común. }
        horaFin: { type: string, example: '11:00:00', description: Fin del tramo en común. }
        minutosEnComun: { type: integer, format: int32, minimum: 30, example: 90 }
        porcentaje: { type: integer, format: int32, minimum: 1, maximum: 100, example: 100 }
        franjasCompartidas: { type: integer, format: int32, minimum: 1, example: 1 }
    ResultadoMatchingDto:
      type: object
      properties:
        estado: { type: string, enum: [OK, SIN_RESULTADOS, SIN_ZONA, NO_VISIBLE] }
        mensaje: { type: string, nullable: true, example: Por ahora nadie de tu campus está libre contigo a esa hora. }
        puente:
          $ref: '#/components/schemas/PuenteDto'
        minutosPuente: { type: integer, format: int32, example: 90 }
        companeros:
          type: array
          maxItems: 20
          items:
            $ref: '#/components/schemas/CompaneroCompatibleDto'
    ActividadExtraidaDto:
      type: object
      description: Datos de la actividad. Un campo en `null` es un dato que falta (ver `faltantes`).
      properties:
        actividad: { type: string, nullable: true, maxLength: 100, example: jugar cartas }
        horaInicio: { type: string, nullable: true, example: '16:00', description: Hora de inicio de hoy, hora de Bolivia (`HH:mm`), entre 07:15 y 21:00. }
        duracionMin: { type: integer, format: int32, nullable: true, minimum: 10, maximum: 240, example: 60 }
        maxParticipantes: { type: integer, format: int32, nullable: true, minimum: 2, maximum: 30, example: 4, description: Personas en total contando a quien la crea. }
    SolicitudExtraccionDto:
      type: object
      properties:
        texto: { type: string, maxLength: 200, example: Quiero jugar cartas por una hora, description: Lo que quiere hacer, o solo la respuesta a la pregunta por un dato faltante. }
        anterior:
          allOf:
            - $ref: '#/components/schemas/ActividadExtraidaDto'
          nullable: true
          description: Lo ya entendido (el campo `actividad` de la respuesta anterior). `null` en la primera consulta.
    RevisionActividadDto:
      type: object
      properties:
        texto: { type: string, maxLength: 200, example: Quiero jugar cartas por una hora, description: La descripción original del estudiante. }
        actividad:
          $ref: '#/components/schemas/ActividadExtraidaDto'
    CrearActividadRequest:
      type: object
      required: [texto, actividad, horaInicio, duracionMin, maxParticipantes, consultaId]
      properties:
        texto: { type: string, maxLength: 200, example: quiero jugar cartas por una hora, description: Lo que escribió el estudiante. }
        actividad: { type: string, maxLength: 100, example: jugar cartas }
        horaInicio: { type: string, example: '16:00', description: HH:mm, de hoy y en hora de Bolivia. }
        duracionMin: { type: integer, format: int32, minimum: 10, maximum: 240, example: 60 }
        maxParticipantes: { type: integer, format: int32, minimum: 2, maximum: 30, example: 4, description: Personas en total, contando a quien la crea. }
        consultaId: { type: integer, format: int64, example: 58, description: '`consultaId` de la extracción completa de la que salió la actividad.' }
    ActividadCreadaDto:
      type: object
      properties:
        id: { type: integer, format: int32, example: 12 }
        actividad: { type: string, example: jugar cartas }
        horaInicio: { type: string, example: '16:00' }
        horaFin: { type: string, example: '17:00' }
        duracionMin: { type: integer, format: int32, example: 60 }
        maxParticipantes: { type: integer, format: int32, example: 4 }
        estado: { type: string, example: ACTIVA }
        invitacion:
          allOf:
            - $ref: '#/components/schemas/InvitacionDto'
          nullable: true
          description: HU13. A quiénes se invitó automáticamente o por qué no se invitó a nadie.
    RespuestaExtraccionDto:
      type: object
      properties:
        consultaId: { type: integer, format: int64, example: 58, description: Id del registro de auditoría (sirve como `log_id` de la comunidad que se cree). }
        estado: { type: string, enum: [COMPLETO, INCOMPLETO, NO_ENTENDIDO] }
        mensaje: { type: string, nullable: true, example: '¿Cuánto tiempo va a durar la actividad?' }
        actividad:
          $ref: '#/components/schemas/ActividadExtraidaDto'
        faltantes:
          type: array
          items: { type: string, enum: [actividad, horaInicio, duracionMin, maxParticipantes] }
        supuestos:
          type: array
          description: Campos que completó el sistema porque el estudiante no los dijo (hoy solo `horaInicio`, «ahora»).
          items: { type: string, enum: [horaInicio] }
    InvitadoDto:
      type: object
      description: Compañero invitado. Sin correo ni id.
      properties:
        nombre: { type: string, example: Diego Mamani }
        carrera: { type: string, nullable: true, example: Ingeniería Industrial }
        libreDesde: { type: string, example: '10:30', description: Desde cuándo comparte la actividad (`HH:mm`, hora de Bolivia). }
        libreHasta: { type: string, example: '11:30' }
        minutosEnComun: { type: integer, format: int32, example: 60 }
    ComunidadDescubrirDto:
      type: object
      properties:
        id: { type: integer, format: int32, example: 12 }
        actividad: { type: string, example: jugar cartas }
        horaInicio: { type: string, example: '16:00', description: Hora de inicio de hoy, hora de Bolivia (`HH:mm`). }
        horaFin: { type: string, example: '17:00' }
        maxParticipantes: { type: integer, format: int32, example: 4 }
        confirmados: { type: integer, format: int32, example: 1, description: Personas que ya están dentro, contando a quien la creó. }
        creador: { type: string, example: Ana P., description: Nombre e inicial del apellido, o «Tú». }
        esMia: { type: boolean, example: false }
        miEstado: { type: string, nullable: true, enum: [PENDIENTE, CONFIRMADO, RECHAZADO], description: 'Si al usuario lo invitaron o se unió (HU14).' }
    ResultadoDescubrirDto:
      type: object
      properties:
        estado: { type: string, enum: [OK, SIN_RESULTADOS, SIN_ZONA, NO_VISIBLE] }
        mensaje: { type: string, nullable: true, example: 'Hoy todavía no hay comunidades activas en tu campus. ¡Crea la primera!' }
        comunidades:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ComunidadDescubrirDto'
    ResponderAsistenciaDto:
      type: object
      required: [asisto]
      description: HU14. `true` = voy; `false` = no voy.
      properties:
        asisto: { type: boolean, example: true }
    AsistenciaDto:
      type: object
      description: HU14. Tu respuesta y cómo quedó el grupo.
      properties:
        comunidadId: { type: integer, format: int32, example: 12 }
        miEstado: { type: string, enum: [CONFIRMADO, RECHAZADO], example: CONFIRMADO }
        confirmados: { type: integer, format: int32, example: 3, description: Personas que van, contando a quien la creó. }
        maxParticipantes: { type: integer, format: int32, example: 4 }
        mensaje: { type: string, example: '¡Listo! Te esperamos en «jugar cartas» hoy de 16:00 a 17:00.' }
    ParticipanteDto:
      type: object
      properties:
        nombre: { type: string, example: Lucía Rojas, description: 'Completo para quien la creó; nombre e inicial para los demás; «Tú» para uno mismo.' }
        carrera: { type: string, nullable: true, example: Derecho, description: Solo la ve quien la creó. }
        estado: { type: string, enum: [PENDIENTE, CONFIRMADO, RECHAZADO], example: CONFIRMADO }
        esCreador: { type: boolean, example: false }
        esTu: { type: boolean, example: false }
    ParticipantesDto:
      type: object
      description: HU14. Quiénes van a una comunidad.
      properties:
        comunidadId: { type: integer, format: int32, example: 12 }
        actividad: { type: string, example: jugar cartas }
        horaInicio: { type: string, example: '16:00' }
        horaFin: { type: string, example: '17:00' }
        confirmados: { type: integer, format: int32, example: 3 }
        maxParticipantes: { type: integer, format: int32, example: 4 }
        esMia: { type: boolean, example: true }
        participantes:
          type: array
          items:
            $ref: '#/components/schemas/ParticipanteDto'
    InvitacionDto:
      type: object
      description: HU13. Resultado de invitar automáticamente a una actividad.
      properties:
        estado:
          type: string
          enum: [INVITADOS, SIN_COINCIDENCIAS, SIN_ZONA, NO_VISIBLE, COMPLETA, ERROR]
          example: INVITADOS
          description: |
            `INVITADOS`: se invitó y avisó a compañeros libres. `SIN_COINCIDENCIAS`: nadie de la sede está libre a esa hora.
            `SIN_ZONA`: falta elegir campus. `NO_VISIBLE`: falta aceptar el matching (es recíproco). `COMPLETA`: no quedan lugares.
            `ERROR`: la actividad quedó creada pero no se pudo invitar (se puede volver a buscar).
        mensaje: { type: string, example: Invitamos a 3 compañeros libres a esa hora. }
        invitados:
          type: array
          description: A quiénes se invitó en este intento, del más al menos compatible.
          items:
            $ref: '#/components/schemas/InvitadoDto'
