openapi: 3.0.3
info:
  title: BREAKU API
  version: v1
  description: |
    API de **BREAKU**: detecta *puentes* (huecos libres de **45 minutos o más** entre dos clases del mismo día).

    Este archivo es una copia estática de la documentación que el backend publica en `/swagger`
    (documento vivo: `GET /swagger/v1/swagger.json`). Cubre autenticación (HU1), horario (HU2),
    puentes (HU3), notificaciones (HU4), ubicación (HU5), recomendaciones con asistente RAG (HU7) y health.

    ### Cómo probar los endpoints protegidos
    1. Ejecuta `POST /api/auth/login` (o `POST /api/auth/register`) con un correo `@ucb.edu.bo`.
    2. Copia el valor de `token` de la respuesta.
    3. Pulsa **Authorize**, pega el token (sin escribir `Bearer`) y confirma.
    4. Ya puedes usar `/api/horario`, `/api/puentes`, `/api/notificaciones`, `/api/ubicacion` y `/api/recomendaciones`.

    ### Convenciones
    - JSON en `camelCase`. Mensajes de error en español.
    - Horas de clase en formato 24 h. Se aceptan `HH:mm` y `HH:mm:ss`; la API responde siempre `HH:mm:ss`.
    - `diaSemana`: 1 = lunes … 6 = sábado.
    - El usuario siempre sale del token; nunca se envía en el cuerpo ni en la URL.
    - Los errores de autenticación responden `{ "message": "..." }` y los de horarios `{ "codigo": "...", "mensaje": "..." }`.
    - El token vence a las 24 horas; después los endpoints protegidos responden `401`.
  contact:
    name: Equipo BREAKU — SIS-227, UCB
servers:
  - url: http://localhost:5092
    description: Desarrollo local (perfil `http` de launchSettings.json)
tags:
  - name: Auth
    description: Registro e inicio de sesión (HU1). Ambos devuelven un token JWT.
  - name: Horario
    description: Horario académico del estudiante (HU2). Requiere JWT; solo opera sobre los bloques del usuario del token.
  - name: Puentes
    description: Puentes detectados (HU3). Requiere JWT. Solo consulta; se recalculan solos al cambiar el horario.
  - name: Notificaciones
    description: Avisos de puente disponible (HU4). Requiere JWT. El servidor crea el aviso al empezar cada puente.
  - name: Ubicación
    description: Consentimiento y selección del campus actual (HU5). Las coordenadas se usan solo para resolver la zona y no se almacenan.
  - name: Lugares
    description: Lugares del catálogo viables para un puente según tiempo, cercanía y zona verificada (HU6). Requiere JWT. Solo muestra lugares aprobados por el administrador.
  - name: Recomendaciones
    description: Recomendación inteligente con asistente RAG de contexto estricto (HU7). Requiere JWT. Solo recomienda lugares reales del catálogo.
  - name: Administración
    description: Panel de administración del campus. Requiere JWT con rol `ADMIN` (claim `role`); con otro rol responde 403.
  - name: Health
    description: Estado del servicio. Sin autenticación y sin cuerpo de respuesta.
paths:
  /api/auth/register:
    post:
      tags: [Auth]
      operationId: registrar
      summary: Crea una cuenta de estudiante y la deja con la sesión iniciada.
      description: |
        Solo se aceptan correos institucionales `usuario@ucb.edu.bo`, y el correo no puede estar ya registrado.
        La cuenta se crea con rol `ESTUDIANTE` y la contraseña se guarda con hash BCrypt.
        Como la respuesta ya incluye el token, no hace falta llamar a `login` después.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequestDto'
      responses:
        '200':
          description: Cuenta creada. Devuelve el token JWT y los datos del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '400':
          description: El correo no es `@ucb.edu.bo` o ya está registrado. El texto viene en `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMensajeDto'
              examples:
                correoNoInstitucional:
                  summary: Correo fuera del dominio institucional
                  value:
                    message: Solo se permite el acceso con un correo institucional (@ucb.edu.bo)
                correoYaRegistrado:
                  summary: Correo ya registrado
                  value:
                    message: El correo electrónico ya está registrado.
  /api/auth/login:
    post:
      tags: [Auth]
      operationId: iniciarSesion
      summary: Inicia sesión con correo institucional y contraseña.
      description: |
        Orden de validación: primero el dominio del correo (`@ucb.edu.bo`) y luego las credenciales.
        El token devuelto vence a las 24 horas; envíalo en el header `Authorization: Bearer {token}`.

        Usuario de prueba de desarrollo (ver README): `dev.estudiante@ucb.edu.bo` / `Breaku-Dev-2026!`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequestDto'
      responses:
        '200':
          description: Credenciales correctas. Devuelve el token JWT y los datos del usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponseDto'
        '400':
          description: El correo no es `@ucb.edu.bo`. El texto viene en `message`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMensajeDto'
              example:
                message: Solo se permite el acceso con un correo institucional (@ucb.edu.bo)
        '401':
          description: Correo no registrado o contraseña incorrecta (mismo mensaje en ambos casos).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorMensajeDto'
              example:
                message: Credenciales inválidas.
  /api/horario:
    get:
      tags: [Horario]
      operationId: listarHorario
      summary: Lista los bloques de clase del usuario.
      description: Ordenados por día de la semana y luego por hora de inicio. Sin bloques devuelve una lista vacía (`[]`). No hay paginación.
      security:
        - Bearer: []
      responses:
        '200':
          description: Lista de bloques del usuario.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HorarioDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
    post:
      tags: [Horario]
      operationId: crearBloque
      summary: Crea un bloque de clase.
      description: |
        Reglas: materia obligatoria (máx. 100 caracteres), `diaSemana` de 1 a 6, horas en formato `HH:mm` o `HH:mm:ss`
        y `horaFin` posterior a `horaInicio`. No puede solaparse con otro bloque del mismo día; dos bloques contiguos
        (uno termina justo cuando empieza el otro) **no** se consideran solapados.

        Efecto secundario: al guardar se recalculan automáticamente los puentes del usuario (ver `GET /api/puentes`).
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardarHorarioRequest'
      responses:
        '201':
          description: Bloque creado. Devuelve el bloque con su `id` y las horas en `HH:mm:ss`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HorarioDto'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '409':
          $ref: '#/components/responses/Solapamiento'
  /api/horario/{id}:
    parameters:
      - name: id
        in: path
        required: true
        description: Identificador del bloque.
        schema:
          type: integer
          format: int32
        example: 12
    put:
      tags: [Horario]
      operationId: editarBloque
      summary: Reemplaza por completo un bloque de clase existente.
      description: |
        Es un `PUT` de reemplazo completo: se envían todos los campos, igual que en el alta. Aplican las mismas reglas
        que en `POST`; el bloque que se edita no se compara consigo mismo al buscar solapamientos.
        Si el bloque pertenece a otro usuario se responde igual que si no existiera (404).

        Efecto secundario: se recalculan automáticamente los puentes del usuario.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GuardarHorarioRequest'
      responses:
        '200':
          description: Bloque actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HorarioDto'
        '400':
          $ref: '#/components/responses/DatosInvalidos'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/BloqueNoEncontrado'
        '409':
          $ref: '#/components/responses/Solapamiento'
    delete:
      tags: [Horario]
      operationId: eliminarBloque
      summary: Elimina un bloque de clase.
      description: |
        Si el bloque pertenece a otro usuario se responde igual que si no existiera (404).
        Efecto secundario: se recalculan automáticamente los puentes del usuario.
      security:
        - Bearer: []
      responses:
        '204':
          description: Bloque eliminado (sin cuerpo).
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          $ref: '#/components/responses/BloqueNoEncontrado'
  /api/horario/foto:
    post:
      tags: [Horario]
      operationId: leerFotoHorario
      summary: Lee las clases de la foto de un horario (no guarda nada).
      description: |
        Un modelo de visión (`LLM_MODEL_IMAGEN`) lee la foto. Las clases que se devuelven ya cumplen las reglas de un alta
        manual; las demás se cuentan en `descartadas`. Para guardarlas, el estudiante las revisa y las envía a `POST /api/horario/lote`.
        Al modelo solo se le envía la imagen, nunca el id ni el nombre del estudiante.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [foto]
              properties:
                foto:
                  type: string
                  format: binary
                  description: JPG, PNG o WebP, hasta 8 MB.
      responses:
        '200':
          description: Clases leídas (lista vacía si la imagen no es un horario).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LecturaFotoHorarioDto'
        '400':
          description: Falta la foto, está vacía, supera 8 MB o no es JPG, PNG ni WebP (`codigo` = `VALIDACION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '503':
          description: El modelo de imagen no está configurado o no respondió (`codigo` = `LECTOR_NO_DISPONIBLE`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
  /api/horario/lote:
    post:
      tags: [Horario]
      operationId: guardarLoteHorario
      summary: Guarda varios bloques de una vez (los confirmados desde la foto), con origen FOTO.
      description: |
        Cada bloque se valida igual que en `POST /api/horario`. Los inválidos o que se solapan con el horario (o con otro del lote)
        vuelven en `rechazados` con el motivo; el resto se guarda. Los puentes se recalculan una sola vez. Hasta 40 bloques.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [bloques]
              properties:
                bloques:
                  type: array
                  maxItems: 40
                  items:
                    $ref: '#/components/schemas/GuardarHorarioRequest'
      responses:
        '200':
          description: Bloques guardados y rechazados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoLoteDto'
        '400':
          description: Lote vacío o con más de 40 bloques (`codigo` = `VALIDACION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
  /api/puentes:
    get:
      tags: [Puentes]
      operationId: listarPuentes
      summary: Puentes detectados del usuario, ordenados por día y hora. Sin puentes, [].
      description: |
        Un puente es el hueco entre el fin de una clase y el inicio de la siguiente, el mismo día, de **45 minutos o más**
        (45 exactos cuentan). El tramo antes de la primera clase y después de la última no es puente.
        No hay endpoint para recalcular: ocurre dentro de `POST`, `PUT` y `DELETE` de `/api/horario`.
        La duración no viene en la respuesta: se calcula como `horaFin − horaInicio`.
      security:
        - Bearer: []
      responses:
        '200':
          description: Lista de puentes del usuario (puede ser vacía).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PuenteDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
  /api/notificaciones:
    get:
      tags: [Notificaciones]
      operationId: listarNotificaciones
      summary: Notificaciones activas del usuario, de la más reciente a la más antigua (máximo 20).
      description: |
        Cada aviso de puente se crea **al empezar el puente** (nunca antes, y a más tardar 1 minuto después) y
        **una sola vez** por puente y día. Si el estudiante cambia su horario y el puente deja de existir, su aviso
        deja de estar activo y ya no aparece aquí. Con las notificaciones desactivadas no se crean avisos.
        No hay push en tiempo real todavía: el cliente debe consultar este endpoint periódicamente (por ejemplo, cada 30 s).
      security:
        - Bearer: []
      responses:
        '200':
          description: Lista de notificaciones activas (puede ser vacía).
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NotificacionDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
  /api/notificaciones/{id}/leida:
    patch:
      tags: [Notificaciones]
      operationId: marcarNotificacionLeida
      summary: Marca una notificación como leída.
      description: Es idempotente. Si es de otro usuario se responde igual que si no existiera (404).
      security:
        - Bearer: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identificador de la notificación.
          schema:
            type: integer
            format: int64
          example: 31
      responses:
        '204':
          description: Notificación marcada como leída (sin cuerpo).
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: La notificación no existe, no está activa o no pertenece al usuario (`codigo` = `NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
              example:
                codigo: NO_ENCONTRADO
                mensaje: La notificación no existe.
  /api/notificaciones/configuracion:
    get:
      tags: [Notificaciones]
      operationId: obtenerConfiguracionNotificaciones
      summary: Indica si el usuario tiene activadas las notificaciones.
      security:
        - Bearer: []
      responses:
        '200':
          description: Preferencia actual. Por defecto, `true`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionNotificacionesDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
    put:
      tags: [Notificaciones]
      operationId: guardarConfiguracionNotificaciones
      summary: Activa o desactiva las notificaciones del usuario.
      description: Con `false` no se envía ningún aviso, pero los puentes se siguen detectando (ver `GET /api/puentes`).
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfiguracionNotificacionesDto'
            example:
              notificacionesActivas: false
      responses:
        '200':
          description: Preferencia guardada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfiguracionNotificacionesDto'
        '400':
          description: Cuerpo mal formado o sin el campo (`ProblemDetails` estándar de ASP.NET).
        '401':
          $ref: '#/components/responses/NoAutorizado'
  /api/ubicacion:
    get:
      tags: [Ubicación]
      operationId: obtenerEstadoUbicacion
      summary: Consulta el consentimiento y el campus actual del usuario.
      security:
        - Bearer: []
      responses:
        '200':
          description: Estado actual; `zonaActual` es `null` si todavía no se eligió un campus.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoUbicacionDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: No se encontró el estudiante.
    put:
      tags: [Ubicación]
      operationId: compartirUbicacion
      summary: Resuelve el campus a partir de una ubicación compartida una sola vez.
      description: Requiere consentimiento explícito en la interfaz. El backend compara la ubicación con las zonas dentro de su radio y no persiste ni devuelve latitud o longitud.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompartirUbicacionRequest'
            example:
              latitud: -16.5
              longitud: -68.15
      responses:
        '200':
          description: Campus coincidente guardado con consentimiento activo.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoUbicacionDto'
        '400':
          description: Coordenadas fuera de rango o solicitud inválida.
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: No se encontró el estudiante.
        '422':
          description: Ninguna zona configurada contiene las coordenadas.
    delete:
      tags: [Ubicación]
      operationId: revocarUbicacion
      summary: Revoca el consentimiento y elimina el campus guardado.
      security:
        - Bearer: []
      responses:
        '204':
          description: Consentimiento revocado y campus eliminado.
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: No se encontró el estudiante.
  /api/ubicacion/zonas:
    get:
      tags: [Ubicación]
      operationId: listarZonas
      summary: Lista las zonas disponibles para selección manual.
      security:
        - Bearer: []
      responses:
        '200':
          description: Zonas ordenadas por nombre.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ZonaDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
  /api/ubicacion/zona:
    put:
      tags: [Ubicación]
      operationId: seleccionarZona
      summary: Guarda manualmente el campus sin solicitar ubicación del dispositivo.
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeleccionarZonaRequest'
            example:
              zonaId: 1
      responses:
        '200':
          description: Zona seleccionada manualmente; el consentimiento de geolocalización permanece desactivado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoUbicacionDto'
        '400':
          description: Solicitud inválida.
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: La zona o el estudiante no existe.
  /api/admin/resumen:
    get:
      tags: [Administración]
      operationId: resumenAdmin
      summary: Cifras del campus para el panel de administración.
      security: [{ Bearer: [] }]
      responses:
        '200':
          description: Lugares activos y en revisión, estudiantes activos, comunidades de hoy, consultas al asistente de los últimos 7 días y reportes pendientes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResumenAdminDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: El usuario no tiene rol `ADMIN`.
  /api/admin/lugares:
    get:
      tags: [Administración]
      operationId: listarLugaresAdmin
      summary: Catálogo completo de lugares, primero los que esperan revisión.
      security: [{ Bearer: [] }]
      responses:
        '200':
          description: Lugares con su categoría, estado, duración, horario y cuántas veces se recomendaron.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LugarAdminDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: El usuario no tiene rol `ADMIN`.
  /api/admin/lugares/{id}/estado:
    patch:
      tags: [Administración]
      operationId: cambiarEstadoLugar
      summary: Activa, pone en revisión o desactiva un lugar.
      description: Solo los lugares `ACTIVO` entran en las recomendaciones. El cambio queda en `historial_cambio` con el estado anterior, el nuevo y el administrador.
      security: [{ Bearer: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int32
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambioEstadoLugarDto'
      responses:
        '204':
          description: Estado actualizado.
        '400':
          description: El estado no es válido (`codigo` = `VALIDACION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: El usuario no tiene rol `ADMIN`.
        '404':
          description: El lugar no existe (`codigo` = `NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
  /api/admin/reportes:
    get:
      tags: [Administración]
      operationId: listarReportesAdmin
      summary: Reportes de estudiantes sobre lugares o comunidades (hasta 100, primero los pendientes).
      security: [{ Bearer: [] }]
      responses:
        '200':
          description: Reportes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReporteAdminDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: El usuario no tiene rol `ADMIN`.
  /api/admin/auditoria-rag:
    get:
      tags: [Administración]
      operationId: auditoriaRag
      summary: Últimas consultas al asistente RAG (auditoría).
      security: [{ Bearer: [] }]
      parameters:
        - name: limite
          in: query
          required: false
          description: Cuántas devolver, de 1 a 200 (por defecto 50).
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 200
      responses:
        '200':
          description: Consultas, de la más reciente a la más antigua.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConsultaRagAdminDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: El usuario no tiene rol `ADMIN`.
  /api/admin/metricas:
    get:
      tags: [Administración]
      operationId: metricasAdmin
      summary: Métricas del asistente en los últimos 7 días.
      security: [{ Bearer: [] }]
      responses:
        '200':
          description: Consultas por resultado, latencia promedio y los 5 lugares más recomendados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MetricasAdminDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '403':
          description: El usuario no tiene rol `ADMIN`.
  /api/lugares/viables:
    get:
      tags: [Lugares]
      operationId: buscarLugaresViables
      summary: Lista los lugares del catálogo viables para un puente del estudiante.
      description: |
        Un lugar es viable si cumple las tres condiciones:

        1. Está en estado `ACTIVO` (verificado y aprobado por el administrador).
        2. Queda dentro del radio de la zona (campus) del estudiante, definida en HU5.
        3. El traslado de ida y vuelta (caminando, unos 80 m por minuto) más la actividad no supera la duración del puente.

        Los lugares salen ordenados del más cercano al más lejano. Si el estudiante todavía no eligió su campus se responde `200`
        con `estado` = `SIN_ZONA`; si ningún lugar cumple, `estado` = `SIN_RESULTADOS` y el mensaje
        «No encontramos opciones cercanas para este tiempo disponible.».
      security:
        - Bearer: []
      parameters:
        - name: puenteId
          in: query
          required: true
          description: Id de un puente del propio estudiante (`GET /api/puentes`).
          schema:
            type: integer
            format: int32
            minimum: 1
          example: 5
      responses:
        '200':
          description: Resultado de la búsqueda (`OK`, `SIN_RESULTADOS` o `SIN_ZONA`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultadoBusquedaLugaresDto'
              examples:
                conLugares:
                  summary: Hay lugares viables
                  value:
                    estado: OK
                    mensaje: null
                    zona: { id: 1, nombre: Campus UCB La Paz }
                    radioAplicadoM: 800
                    minutosDisponibles: 120
                    lugares:
                      - lugarId: 2
                        nombre: Biblioteca Central
                        categoria: Estudio
                        descripcion: Salas silenciosas y computadoras para estudiar.
                        distanciaM: 55
                        tiempoTrasladoMin: 2
                        duracionEstimadaMin: 45
                sinResultados:
                  summary: Ningún lugar cumple tiempo, cercanía y verificación
                  value:
                    estado: SIN_RESULTADOS
                    mensaje: No encontramos opciones cercanas para este tiempo disponible.
                    zona: { id: 1, nombre: Campus UCB La Paz }
                    radioAplicadoM: 800
                    minutosDisponibles: 45
                    lugares: []
                sinZona:
                  summary: Falta elegir el campus
                  value:
                    estado: SIN_ZONA
                    mensaje: Elige tu campus para ver lugares cercanos.
                    zona: null
                    radioAplicadoM: null
                    minutosDisponibles: 120
                    lugares: []
        '400':
          description: Falta `puenteId` o no es un número positivo (`codigo` = `VALIDACION`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: El puente no existe o no pertenece al usuario (`codigo` = `NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
  /api/recomendaciones:
    post:
      tags: [Recomendaciones]
      operationId: recomendar
      summary: Pide al asistente recomendaciones para un puente del usuario.
      description: |
        El asistente **solo** recibe los lugares del catálogo que cumplen tiempo, cercanía y zona (búsqueda de HU6),
        y el sistema descarta cualquier lugar o dato que no salga de ese contexto. Distancia, tiempo y categoría
        salen del catálogo; del asistente solo sale `explicacion`. Cada consulta queda en el log de auditoría con los
        lugares del catálogo que la respaldan.

        Si no hay lugares viables, no se llama al asistente y se responde `200` con `estado` = `SIN_RESULTADOS`
        y el mensaje «No encontramos opciones cercanas para este tiempo disponible.».
      security:
        - Bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudRecomendacionDto'
            example:
              puenteId: 5
              entrada: Estoy cansado, quiero algo tranquilo
      responses:
        '200':
          description: Recomendaciones (`OK`) o mensaje de que no hay opciones (`SIN_RESULTADOS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaRecomendacionDto'
              examples:
                conRecomendaciones:
                  summary: Hay lugares viables
                  value:
                    consultaId: 42
                    estado: OK
                    mensaje: null
                    recomendaciones:
                      - id: 87
                        lugarId: 2
                        nombre: Biblioteca Central
                        categoria: Estudio
                        distanciaM: 200
                        tiempoTrasladoMin: 6
                        duracionEstimadaMin: 30
                        explicacion: Ideal para repasar en silencio antes de tu próxima clase.
                sinResultados:
                  summary: Ningún lugar cumple tiempo, cercanía y seguridad
                  value:
                    consultaId: 43
                    estado: SIN_RESULTADOS
                    mensaje: No encontramos opciones cercanas para este tiempo disponible.
                    recomendaciones: []
        '400':
          description: La preferencia supera los 300 caracteres (`codigo` = `VALIDACION`) o el cuerpo está mal formado (`ProblemDetails` estándar de ASP.NET).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
              example:
                codigo: VALIDACION
                mensaje: La preferencia puede tener como máximo 300 caracteres.
        '401':
          $ref: '#/components/responses/NoAutorizado'
        '404':
          description: El puente no existe o no pertenece al usuario (`codigo` = `NO_ENCONTRADO`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
              example:
                codigo: NO_ENCONTRADO
                mensaje: El puente no existe.
        '503':
          description: El asistente no respondió (`codigo` = `ASISTENTE_NO_DISPONIBLE`). La consulta queda registrada como `ERROR`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorNegocioDto'
              example:
                codigo: ASISTENTE_NO_DISPONIBLE
                mensaje: El asistente no está disponible en este momento. Intenta de nuevo en unos minutos.
  /health:
    get:
      tags: [Health]
      operationId: health
      summary: Comprueba que la API está en marcha.
      responses:
        '200':
          description: La API responde.
  /health/db:
    get:
      tags: [Health]
      operationId: healthDb
      summary: Comprueba que la API puede conectarse a la base de datos MySQL.
      responses:
        '200':
          description: Conexión a la base de datos correcta.
        '503':
          description: No se pudo conectar a la base de datos.
components:
  securitySchemes:
    Bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenido en `POST /api/auth/login` o `POST /api/auth/register`. Pégalo sin la palabra `Bearer`.
  responses:
    NoAutorizado:
      description: Falta el token, es inválido o está vencido. Sin cuerpo.
    BloqueNoEncontrado:
      description: El bloque no existe o no pertenece al usuario (`codigo` = `NO_ENCONTRADO`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorNegocioDto'
          example:
            codigo: NO_ENCONTRADO
            mensaje: El bloque no existe.
    Solapamiento:
      description: Se solapa con otro bloque del mismo día (`codigo` = `SOLAPAMIENTO`); el mensaje indica con cuál.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorNegocioDto'
          example:
            codigo: SOLAPAMIENTO
            mensaje: Se solapa con «Cálculo I» (08:00-09:30).
    DatosInvalidos:
      description: |
        Datos inválidos. Hay dos formas de respuesta:
        - Regla de negocio incumplida: `{ "codigo": "VALIDACION", "mensaje": "..." }` (`ErrorNegocioDto`).
        - Cuerpo mal formado o con campos faltantes: `ValidationProblemDetails` estándar de ASP.NET.
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ErrorNegocioDto'
              - $ref: '#/components/schemas/ValidationProblemDetails'
          examples:
            horaFinInvalida:
              summary: La hora de fin no es posterior a la de inicio
              value:
                codigo: VALIDACION
                mensaje: La hora de fin tiene que ser posterior a la hora de inicio.
            formatoDeHora:
              summary: Hora con formato no admitido
              value:
                codigo: VALIDACION
                mensaje: Las horas deben tener formato HH:mm o HH:mm:ss.
            diaFueraDeRango:
              summary: Día fuera de 1 a 6
              value:
                codigo: VALIDACION
                mensaje: El día debe ir de 1 (lunes) a 6 (sábado).
            materiaVacia:
              summary: Materia vacía
              value:
                codigo: VALIDACION
                mensaje: La materia es obligatoria.
  schemas:
    LoginRequestDto:
      type: object
      description: Credenciales para iniciar sesión.
      required: [email, password]
      properties:
        email:
          type: string
          description: Correo institucional. Solo se aceptan direcciones `usuario@ucb.edu.bo`.
          example: dev.estudiante@ucb.edu.bo
        password:
          type: string
          format: password
          description: Contraseña de la cuenta.
          example: Breaku-Dev-2026!
    RegisterRequestDto:
      type: object
      description: Datos para crear una cuenta de estudiante.
      required: [nombre, email, password]
      properties:
        nombre:
          type: string
          description: Nombre completo del estudiante.
          example: Ana Pérez
        email:
          type: string
          description: Correo institucional. Solo se aceptan direcciones `usuario@ucb.edu.bo` y no puede estar ya registrado.
          example: ana.perez@ucb.edu.bo
        password:
          type: string
          format: password
          description: Contraseña de la cuenta. Se guarda con hash BCrypt.
          example: MiClaveSegura-2026
    AuthResponseDto:
      type: object
      description: Sesión iniciada. Token JWT y datos básicos del usuario.
      properties:
        token:
          type: string
          description: 'Token JWT (HS256, vigencia de 24 horas). Claims `sub` (id del usuario), `email`, `nombre` y `role` (`ESTUDIANTE` o `ADMIN`). Se envía en `Authorization: Bearer {token}`.'
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJzdWIiOiI3In0.firma
        userId:
          type: integer
          format: int32
          description: Identificador del usuario.
          example: 7
        nombre:
          type: string
          description: Nombre completo del usuario.
          example: Ana Pérez
        email:
          type: string
          description: Correo institucional del usuario.
          example: ana.perez@ucb.edu.bo
        rol:
          type: string
          enum: [ESTUDIANTE, ADMIN]
          description: Rol del usuario. El frontend lo usa para mostrar el panel de administración.
          example: ESTUDIANTE
    ErrorMensajeDto:
      type: object
      description: Error de autenticación (login y registro).
      properties:
        message:
          type: string
          description: Mensaje en español, listo para mostrar al usuario.
          example: Solo se permite el acceso con un correo institucional (@ucb.edu.bo)
    ErrorNegocioDto:
      type: object
      description: Error de negocio (horarios, notificaciones y recomendaciones).
      properties:
        codigo:
          type: string
          enum: [VALIDACION, SOLAPAMIENTO, NO_ENCONTRADO, ASISTENTE_NO_DISPONIBLE]
          description: '`VALIDACION` (400), `SOLAPAMIENTO` (409), `NO_ENCONTRADO` (404) o `ASISTENTE_NO_DISPONIBLE` (503).'
          example: SOLAPAMIENTO
        mensaje:
          type: string
          description: Mensaje en español, listo para mostrar al usuario.
          example: Se solapa con «Cálculo I» (08:00-09:30).
    ValidationProblemDetails:
      type: object
      description: Error de validación estándar de ASP.NET (cuerpo mal formado o campos faltantes).
      properties:
        type:
          type: string
          nullable: true
          example: https://tools.ietf.org/html/rfc9110#section-15.5.1
        title:
          type: string
          nullable: true
          example: One or more validation errors occurred.
        status:
          type: integer
          format: int32
          nullable: true
          example: 400
        errors:
          type: object
          description: Campo → lista de mensajes.
          additionalProperties:
            type: array
            items:
              type: string
          example:
            req: [El campo req es obligatorio.]
    GuardarHorarioRequest:
      type: object
      description: Datos de un bloque de clase. Sirve para crear (POST) y para reemplazar (PUT) un bloque.
      required: [materia, diaSemana, horaInicio, horaFin]
      properties:
        materia:
          type: string
          minLength: 1
          maxLength: 100
          description: Nombre de la materia. Obligatorio, hasta 100 caracteres (se recortan los espacios de los extremos).
          example: Cálculo I
        diaSemana:
          type: integer
          format: int32
          minimum: 1
          maximum: 6
          description: 'Día de la semana: 1 = lunes … 6 = sábado.'
          example: 1
        horaInicio:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$'
          description: Hora de inicio en formato 24 h (`HH:mm` o `HH:mm:ss`).
          example: '08:00'
        horaFin:
          type: string
          pattern: '^([01]\d|2[0-3]):[0-5]\d(:[0-5]\d)?$'
          description: Hora de fin en formato 24 h (`HH:mm` o `HH:mm:ss`). Debe ser posterior a la hora de inicio.
          example: '09:30'
        aula:
          type: string
          nullable: true
          maxLength: 30
          description: Aula (opcional, hasta 30 caracteres). Si llega vacía se guarda como `null`.
          example: A-101
    HorarioDto:
      type: object
      description: Bloque de clase del estudiante.
      properties:
        id:
          type: integer
          format: int32
          description: Identificador del bloque.
          example: 12
        materia:
          type: string
          description: Nombre de la materia.
          example: Cálculo I
        diaSemana:
          type: integer
          format: int32
          description: 'Día de la semana: 1 = lunes … 6 = sábado.'
          example: 1
        horaInicio:
          type: string
          description: Hora de inicio (`HH:mm:ss`, 24 h).
          example: '08:00:00'
        horaFin:
          type: string
          description: Hora de fin (`HH:mm:ss`, 24 h).
          example: '09:30:00'
        aula:
          type: string
          nullable: true
          description: Aula, o `null` si no se indicó.
          example: A-101
        origen:
          type: string
          enum: [MANUAL, FOTO]
          description: 'Cómo se cargó el bloque: `MANUAL` (hoy siempre) o `FOTO` (reservado). El cliente no lo envía.'
          example: MANUAL
    PuenteDto:
      type: object
      description: Puente detectado. Hueco libre de 45 minutos o más entre dos clases del mismo día.
      properties:
        id:
          type: integer
          format: int32
          description: Identificador del puente.
          example: 5
        diaSemana:
          type: integer
          format: int32
          description: 'Día de la semana: 1 = lunes … 6 = sábado.'
          example: 1
        horaInicio:
          type: string
          description: Hora en que termina la clase anterior (`HH:mm:ss`, 24 h).
          example: '09:30:00'
        horaFin:
          type: string
          description: Hora en que empieza la clase siguiente (`HH:mm:ss`, 24 h).
          example: '10:30:00'
    NotificacionDto:
      type: object
      description: Aviso para el estudiante. Hoy solo existe el tipo `PUENTE_DISPONIBLE` (HU4).
      properties:
        id:
          type: integer
          format: int64
          description: Identificador de la notificación.
          example: 31
        tipo:
          type: string
          enum: [PUENTE_DISPONIBLE, INVITACION_COMUNIDAD, COMUNIDAD_CERRADA]
          description: Tipo de aviso.
          example: PUENTE_DISPONIBLE
        mensaje:
          type: string
          description: Texto listo para mostrar al usuario.
          example: ¡Puente disponible! Tienes 1 h 30 min libres, de 10:00 a 11:30.
        fecha:
          type: string
          format: date
          nullable: true
          description: Día del puente (`yyyy-MM-dd`, hora de Bolivia). `null` si no es un aviso de puente.
          example: '2026-10-22'
        horaInicio:
          type: string
          nullable: true
          description: Inicio del puente (`HH:mm:ss`). `null` si no es un aviso de puente.
          example: '10:00:00'
        horaFin:
          type: string
          nullable: true
          description: Fin del puente (`HH:mm:ss`). `null` si no es un aviso de puente.
          example: '11:30:00'
        duracionMinutos:
          type: integer
          format: int32
          nullable: true
          description: Duración disponible del puente en minutos. `null` si no es un aviso de puente.
          example: 90
        leida:
          type: boolean
          description: Si el usuario ya la marcó como leída.
          example: false
        creadaEn:
          type: string
          format: date-time
          description: Momento del envío (UTC).
          example: '2026-10-22T14:00:04.512Z'
    ConfiguracionNotificacionesDto:
      type: object
      description: Preferencia de avisos del usuario.
      required: [notificacionesActivas]
      properties:
        notificacionesActivas:
          type: boolean
          description: '`true` = recibe avisos de puente. `false` = no recibe ninguno, aunque sus puentes se siguen detectando.'
          example: true
    SolicitudRecomendacionDto:
      type: object
      description: Pedido de recomendación para un puente del usuario.
      required: [puenteId]
      properties:
        puenteId:
          type: integer
          format: int32
          description: Puente del usuario para el que se busca qué hacer (ver `GET /api/puentes`).
          example: 5
        entrada:
          type: string
          nullable: true
          maxLength: 300
          description: Preferencia libre del estudiante (opcional).
          example: Estoy cansado, quiero algo tranquilo
    RespuestaRecomendacionDto:
      type: object
      description: Resultado de la consulta al asistente.
      properties:
        consultaId:
          type: integer
          format: int64
          description: Identificador del registro de auditoría de esta consulta.
          example: 42
        estado:
          type: string
          enum: [OK, SIN_RESULTADOS]
          description: '`OK` = hay recomendaciones. `SIN_RESULTADOS` = no hay; se muestra `mensaje`.'
          example: OK
        mensaje:
          type: string
          nullable: true
          description: Texto para mostrar cuando no hay recomendaciones. `null` si las hay.
          example: No encontramos opciones cercanas para este tiempo disponible.
        recomendaciones:
          type: array
          description: De la más a la menos adecuada (máximo 3). Vacía si `estado` = `SIN_RESULTADOS`.
          items:
            $ref: '#/components/schemas/RecomendacionDto'
    RecomendacionDto:
      type: object
      description: Una recomendación. Todos los datos salen del catálogo; del asistente solo sale `explicacion`.
      properties:
        id:
          type: integer
          format: int64
          description: Identificador de la recomendación.
          example: 87
        lugarId:
          type: integer
          format: int32
          description: Lugar del catálogo que respalda la recomendación.
          example: 2
        nombre:
          type: string
          description: Nombre del lugar, tal como está en el catálogo.
          example: Biblioteca Central
        categoria:
          type: string
          description: Categoría del lugar.
          example: Estudio
        distanciaM:
          type: integer
          format: int32
          description: Distancia desde la zona del estudiante, en metros.
          example: 200
        tiempoTrasladoMin:
          type: integer
          format: int32
          description: Tiempo de traslado de ida y vuelta, en minutos.
          example: 6
        duracionEstimadaMin:
          type: integer
          format: int32
          description: Tiempo estimado de la actividad en el lugar, en minutos.
          example: 30
        explicacion:
          type: string
          description: Por qué encaja, redactado por el asistente.
          example: Ideal para repasar en silencio antes de tu próxima clase.
    ZonaDto:
      type: object
      required: [id, nombre]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        nombre:
          type: string
          example: Campus central
    EstadoUbicacionDto:
      type: object
      required: [consentimientoActivo, zonaActual]
      properties:
        consentimientoActivo:
          type: boolean
          description: Indica si el estudiante autorizó compartir ubicación del dispositivo.
          example: false
        zonaActual:
          allOf:
            - $ref: '#/components/schemas/ZonaDto'
          nullable: true
          description: Campus elegido o detectado, o `null` si no se ha seleccionado.
    CompartirUbicacionRequest:
      type: object
      required: [latitud, longitud]
      properties:
        latitud:
          type: number
          format: double
          minimum: -90
          maximum: 90
          example: -16.5
        longitud:
          type: number
          format: double
          minimum: -180
          maximum: 180
          example: -68.15
    SeleccionarZonaRequest:
      type: object
      required: [zonaId]
      properties:
        zonaId:
          type: integer
          format: int32
          minimum: 1
          example: 1
    LugarViableDto:
      type: object
      required: [lugarId, nombre, categoria, distanciaM, tiempoTrasladoMin, duracionEstimadaMin]
      properties:
        lugarId:
          type: integer
          format: int32
          example: 2
        nombre:
          type: string
          example: Biblioteca Central
        categoria:
          type: string
          example: Estudio
        descripcion:
          type: string
          nullable: true
          example: Salas silenciosas y computadoras para estudiar.
        distanciaM:
          type: integer
          format: int32
          description: Distancia en línea recta desde el campus, en metros.
          example: 120
        tiempoTrasladoMin:
          type: integer
          format: int32
          description: Minutos de traslado caminando, de ida y vuelta.
          example: 3
        duracionEstimadaMin:
          type: integer
          format: int32
          description: Minutos que lleva la actividad en el lugar.
          example: 45
    ResultadoBusquedaLugaresDto:
      type: object
      required: [estado, minutosDisponibles, lugares]
      properties:
        estado:
          type: string
          enum: [OK, SIN_RESULTADOS, SIN_ZONA]
          example: OK
        mensaje:
          type: string
          nullable: true
          description: Texto para mostrar cuando el estado no es `OK`.
        zona:
          allOf:
            - $ref: '#/components/schemas/ZonaDto'
          nullable: true
          description: Campus usado como origen; `null` con `SIN_ZONA`.
        radioAplicadoM:
          type: integer
          format: int32
          nullable: true
          example: 800
        minutosDisponibles:
          type: integer
          format: int32
          description: Duración del puente consultado, en minutos.
          example: 110
        lugares:
          type: array
          items:
    ResumenAdminDto:
      type: object
      properties:
        lugaresActivos: { type: integer, format: int32, example: 6 }
        lugaresEnRevision: { type: integer, format: int32, example: 1 }
        estudiantes: { type: integer, format: int32, example: 3 }
        comunidadesHoy: { type: integer, format: int32, example: 0 }
        consultasRagSemana: { type: integer, format: int32, example: 18 }
        reportesPendientes: { type: integer, format: int32, example: 0 }
    LugarAdminDto:
      type: object
      properties:
        id: { type: integer, format: int32, example: 6 }
