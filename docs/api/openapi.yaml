        tipo: { type: string, example: RECOMENDACION }
        entrada: { type: string, nullable: true, example: Una plática con café }
        estado: { type: string, enum: [OK, SIN_RESULTADOS, RECHAZADO_SEGURIDAD, ERROR] }
        modelo: { type: string, nullable: true, example: 'qwen2.5:3b' }
        latenciaMs: { type: integer, format: int32, nullable: true, example: 23494 }
